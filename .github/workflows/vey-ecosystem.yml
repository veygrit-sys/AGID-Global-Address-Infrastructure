name: Vey Ecosystem Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/product/vey-ecosystem-strategy.md"
      - "src/lib/veyEcosystemResearch.ts"
      - "src/lib/veyEcosystemResearch.test.ts"
      - "scripts/verify-vey-ecosystem-workflow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vey-ecosystem.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "docs/product/vey-ecosystem-strategy.md"
      - "src/lib/veyEcosystemResearch.ts"
      - "src/lib/veyEcosystemResearch.test.ts"
      - "scripts/verify-vey-ecosystem-workflow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vey-ecosystem.yml"

permissions:
  contents: read

jobs:
  vey-ecosystem-registry:
    name: Vey ecosystem registry contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Vey ecosystem research
        run: npm run verify:vey-ecosystem

      - name: Check workflow contract
        run: npm run verify:vey-ecosystem-workflow
