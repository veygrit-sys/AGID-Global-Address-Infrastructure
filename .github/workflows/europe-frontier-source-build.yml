name: Build pinned European frontier sources
on:
  pull_request:
    branches: [codex/europe-complete-frontiers]
    paths:
      - '.github/workflows/europe-frontier-source-build.yml'
      - 'scripts/*europe-frontier*'
      - 'scripts/build-monaco-shoreline.py'
      - 'scripts/data/europe-frontiers/**'
permissions:
  contents: write
concurrency: {group: europe-frontier-source-build, cancel-in-progress: true}
jobs:
  build:
    if: github.repository == 'veygrit-sys/AGID-Global-Address-Infrastructure' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/europe-frontier-source-build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/europe-frontier-source-build
      - name: Install geospatial source readers
        run: python -m pip install 'shapely>=2.1,<3' pyproj 'pyshp<3' numpy osmium
      - name: Compile surveyed land, maritime records and territorial administrative areas
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/fetch-europe-frontier-sources.py --cache "$RUNNER_TEMP/sources" --output "$RUNNER_TEMP/europe.json"
          python scripts/supplement-europe-frontiers.py "$RUNNER_TEMP/europe.json" --cache "$RUNNER_TEMP/sources" --areas src/data/europe-frontiers/local-areas.json
          node scripts/build-europe-frontiers.mjs "$RUNNER_TEMP/europe.json" src/data/europe-frontiers
          git add src/data/europe-frontiers
          git diff --cached --quiet || git commit -m "Include complete local surveys, joint administration and reference lines"
          git push origin HEAD:refs/heads/codex/europe-frontier-source-build
      - name: Compile full-resolution country polygons surrounding the lines
        run: |
          python scripts/build-europe-frontier-sides.py --cache "$RUNNER_TEMP/sources"
          git add src/data/europe-frontier-sides
          git diff --cached --quiet || git commit -m "Index unsimplified country polygons on both sides of the frontier"
          git push origin HEAD:refs/heads/codex/europe-frontier-source-build
