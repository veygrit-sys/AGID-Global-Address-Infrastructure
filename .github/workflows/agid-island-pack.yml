name: High-resolution island data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/island-evidence-pack.py'
      - 'scripts/data/fieldmaps-shoreline-proof.json'
      - 'src/lib/territorial*'
      - 'src/lib/islandPolicy.ts'
      - 'src/lib/islandBorder*'
      - 'src/data/islandBorder*'
      - 'scripts/build-island-border-review.py'
      - 'src/lib/globalIslands.ts'
      - 'src/lib/globalLandformGrid.ts'
      - 'src/data/global-islands/**'
      - 'src/data/territorial-exclaves/**'
      - 'scripts/audit-island-evidence-pack.py'
      - 'scripts/query-island-pack.ts'
      - 'scripts/*national-island*'
      - 'scripts/data/national-island-points/**'
      - 'src/data/nationalIslandSupplement.json'
      - 'src/data/*PolygonDetail.json'
      - 'src/lib/northAmericanPolygonDetail.ts'
      - 'src/lib/oceaniaPolygonDetail.ts'
      - 'src/lib/surveyRegion.ts'
      - 'src/lib/reviewedGeography.ts'
      - 'scripts/verify-island-evidence-pack.ts'
      - '.github/workflows/agid-island-pack.yml'
permissions:
  contents: read
jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-gdal
      - name: Build from checksum-pinned GSHHG and FieldMaps archives
        run: |
          mkdir -p island-download
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 \
            https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip \
            -o "$RUNNER_TEMP/gshhg-shp-2.3.7.zip"
          /usr/bin/python3 scripts/island-evidence-pack.py build island-download/world.sqlite \
            --gshhg-archive "$RUNNER_TEMP/gshhg-shp-2.3.7.zip" > island-download/build-manifest.json
      - name: Verify point classification and record the artifact checksum
        run: |
          node --import tsx scripts/verify-island-evidence-pack.ts island-download/world.sqlite /usr/bin/python3
          /usr/bin/python3 scripts/audit-island-evidence-pack.py island-download/world.sqlite --gap-register island-download/island-source-gaps.zip > island-download/source-audit.json
          cp docs/high-resolution-island-pack.md island-download/README.md
          mkdir -p island-download/licenses/gshhg
          unzip -j "$RUNNER_TEMP/gshhg-shp-2.3.7.zip" LICENSE.TXT COPYING.LESSERv3 README.TXT -d island-download/licenses/gshhg
          cp /usr/share/common-licenses/GPL-3 island-download/licenses/gshhg/COPYING
          cd island-download
          sha256sum world.sqlite island-source-gaps.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agid-world-islands
          path: island-download/
          compression-level: 0
          retention-days: 14
