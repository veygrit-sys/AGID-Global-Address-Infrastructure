name: High-resolution island data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/island-evidence-pack.py'
      - 'scripts/audit-island-evidence-pack.py'
      - 'scripts/query-island-pack.ts'
      - 'scripts/verify-island-evidence-pack.ts'
      - '.github/workflows/agid-island-pack.yml'
permissions:
  contents: read
jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-gdal
      - name: Build from checksum-pinned GSHHG and FieldMaps archives
        run: |
          mkdir -p island-download
          /usr/bin/python3 scripts/island-evidence-pack.py build island-download/world.sqlite > island-download/build-manifest.json
      - name: Verify point classification and record the artifact checksum
        run: |
          node --import tsx scripts/verify-island-evidence-pack.ts island-download/world.sqlite /usr/bin/python3
          /usr/bin/python3 scripts/audit-island-evidence-pack.py island-download/world.sqlite --gap-register island-download/island-source-gaps.zip > island-download/source-audit.json
          cp docs/high-resolution-island-pack.md island-download/README.md
          cd island-download
          sha256sum world.sqlite island-source-gaps.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agid-world-islands
          path: island-download/
          compression-level: 0
          retention-days: 14
