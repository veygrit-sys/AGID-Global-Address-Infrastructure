name: AddressQL DuckDB CLI Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  duckdb-cli-smoke:
    name: DuckDB CLI required smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "$RUNNER_TEMP/duckdb_cli-linux-amd64.zip" \
            "https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$RUNNER_TEMP/duckdb_cli-linux-amd64.zip" -d "$RUNNER_TEMP/duckdb"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"

      - name: Show DuckDB version
        run: duckdb --version

      - name: Run static DuckDB adapter gate
        run: npm run verify:addressql-duckdb

      - name: Run required DuckDB CLI smoke
        run: npm run verify:addressql-duckdb:cli -- --require-cli
