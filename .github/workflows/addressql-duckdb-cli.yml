name: AddressQL DuckDB CLI Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  duckdb-cli-smoke:
    name: DuckDB CLI required smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/duckdb-cli-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/duckdb/duckdb/releases/download/v2.0.1/duckdb-cli-linux-amd64.tar.gz"
          echo "b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/duckdb"
          tar -xzf "$archive" -C "$RUNNER_TEMP/duckdb" duckdb
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"

      - name: Show DuckDB version
        run: duckdb --version

      - name: Run static DuckDB adapter gate
        run: npm run verify:addressql-duckdb

      - name: Run required DuckDB CLI smoke
        run: npm run verify:addressql-duckdb:cli -- --require-cli
