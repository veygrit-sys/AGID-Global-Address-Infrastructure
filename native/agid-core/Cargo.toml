[package]
name = "agid-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust core math implementation for AGID encoding/decoding."

[features]
# The shipped browser math module has a smaller ABI than a full native build.
coordinate-wasm = []

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
