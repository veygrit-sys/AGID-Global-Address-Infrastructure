[package]
name = "addressql-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure Rust core functions for AddressQL database and SDK adapters."

[lib]
name = "addressql_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
ffi = []

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
