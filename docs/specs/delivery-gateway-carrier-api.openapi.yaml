openapi: 3.1.0
info:
  title: Delivery Gateway Carrier API
  version: delivery-gateway-carrier-api-v0.1
  summary: Stripe-like carrier integration API for safe rates, allocation, labels, tracking, and proof refs.
  description: >
    Delivery Gateway gives merchants and apps one carrier integration boundary
    while raw addresses, recipient contacts, carrier API keys, raw labels,
    proof witnesses, and production credentials stay out of public fixtures and
    merchant callbacks.
servers:
  - url: https://api.veygrit.example
    description: Placeholder host. Deployments must configure their own hosted or private endpoint.
tags:
  - name: Delivery Gateway Carrier API
externalDocs:
  description: Delivery Gateway sandbox carrier smoke fixture, schema, verifier commands, and non-claims.
  url: ./README.md#delivery-gateway-sandbox-carrier-smoke
paths:
  /v1/shipment-intents:
    post:
      operationId: createShipmentIntent
      tags:
        - Delivery Gateway Carrier API
      summary: Create a sandbox ShipmentIntent from wallet-safe refs.
      description: >
        Creates a ref-first shipment intent before rate quote, carrier
        allocation, label creation, or settlement. Public requests must use
        recipient token, parcel profile, AddressQL validation, and optional
        wallet consent refs only.
      x-agid-contract-id: address-stripe-shipment-intent
      x-agid-source-contract: src/lib/addressStripeFoundation.ts#createShipmentIntentSandbox
      x-agid-redacted-fields:
        - raw_address
        - recipient_phone
        - carrier_api_key
        - carrier_credential
        - proof_witness
        - private_key
        - proof_secret
      x-agid-non-claims:
        - not-raw-address-intake
        - not-wallet-consent
        - not-proof-of-residence
        - not-real-label-purchase
        - not-production-carrier-traffic
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentIntentCreateRequest'
            examples:
              cheapestSynthetic:
                summary: Safe synthetic shipment intent request
                value:
                  merchantRef: merchant_synthetic_demo
                  recipientTokenRef: rectok_synthetic_friend_001
                  parcelProfileRef: parcel_profile_synthetic_small_001
                  addressValidationRef: addrval_synthetic_001
                  walletConsentRef: consent_synthetic_001
                  servicePreference: cheapest
      responses:
        '201':
          description: Synthetic ShipmentIntent refs.
          headers:
            skipship-idempotency-key:
              $ref: '#/components/headers/SkipshipIdempotencyKey'
            skipship-idempotency-replayed:
              $ref: '#/components/headers/SkipshipIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentIntentResult'
        '400':
          description: Request contained missing refs or forbidden private material.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/delivery/rates:
    post:
      operationId: quoteDeliveryRates
      tags:
        - Delivery Gateway Carrier API
      summary: Quote normalized carrier rates from safe refs.
      description: >
        Quotes synthetic or managed carrier options from address aliases,
        parcel profile refs, and delivery objectives. Public requests must use
        refs and policy hints only; they must not contain raw address lines,
        recipient contact fields, carrier credentials, or proof witnesses.
      x-agid-contract-id: delivery-gateway-rate-quote
      x-agid-source-contract: src/lib/deliveryGatewayCarrierApi.ts#DELIVERY_GATEWAY_API_SURFACES.rate-quote
      x-agid-redacted-fields:
        - raw_address
        - recipient_name
        - recipient_phone
        - carrier_api_key
        - proof_witness
      x-agid-non-claims:
        - not-raw-address-intake
        - not-proof-witness-intake
        - not-production-carrier-traffic
        - not-delivery-guarantee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateQuoteRequest'
            examples:
              cheapestSynthetic:
                summary: Safe synthetic rate quote request
                value:
                  addressAliasRef: addr_alias_synthetic_only
                  parcelProfileRef: parcel_profile_synthetic_only
                  objective: cheapest
                  requestedServiceLevels:
                    - standard
                    - economy
                  policyRef: merchant_policy_demo
      responses:
        '200':
          description: Normalized safe carrier rate options.
          headers:
            skipship-idempotency-key:
              $ref: '#/components/headers/SkipshipIdempotencyKey'
            skipship-idempotency-replayed:
              $ref: '#/components/headers/SkipshipIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateQuoteResult'
        '400':
          description: Request contained missing refs or forbidden private material.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/delivery/allocate:
    post:
      operationId: allocateDeliveryCarrier
      tags:
        - Delivery Gateway Carrier API
      summary: Allocate a carrier choice from a rate ref and wallet consent ref.
      description: >
        Selects fastest, cheapest, balanced, or risk-minimized carrier options
        using safe refs. Allocation is not a label purchase and does not expose
        carrier credentials, decrypt material, raw carrier labels, or private
        policy bodies.
      x-agid-contract-id: delivery-gateway-carrier-allocation
      x-agid-source-contract: src/lib/deliveryGatewayCarrierApi.ts#DELIVERY_GATEWAY_API_SURFACES.carrier-allocation
      x-agid-redacted-fields:
        - raw_address
        - recipient_name
        - recipient_phone
        - unscoped_decrypt_material
        - carrier_credential
        - private_policy_body
      x-agid-non-claims:
        - not-raw-address-intake
        - not-proof-witness-intake
        - not-real-label-purchase
        - not-delivery-guarantee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierAllocationRequest'
            examples:
              cheapestSynthetic:
                summary: Safe synthetic carrier allocation request
                value:
                  rateRef: rate_dadbd84bc23fa9d12f6c0c54
                  walletConsentRef: consent_synthetic_only
                  objective: cheapest
                  merchantPolicyRef: merchant_policy_demo
      responses:
        '200':
          description: Carrier allocation decision refs.
          headers:
            skipship-idempotency-key:
              $ref: '#/components/headers/SkipshipIdempotencyKey'
            skipship-idempotency-replayed:
              $ref: '#/components/headers/SkipshipIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierAllocationResult'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/shipments:
    post:
      operationId: createSkipshipShipment
      tags:
        - Delivery Gateway Carrier API
      summary: Create a Skipship sandbox shipment from a recipient ID.
      description: >
        Developer-facing shipment facade for the Delivery Gateway sandbox flow.
        The request uses a recipient ID, parcel profile ref, wallet consent ref,
        and service preference, then maps internally to rate, allocation, label,
        tracking, and delivery proof refs. Public requests must not contain raw
        address lines, recipient contacts, carrier credentials, proof witnesses,
        or raw carrier label payloads.
      x-agid-contract-id: skipship-create-shipment
      x-agid-source-contract: src/lib/deliveryGatewayCarrierApi.ts#createSkipshipShipment
      x-agid-redacted-fields:
        - raw_address
        - recipient_name
        - recipient_phone
        - carrier_api_key
        - raw_label_payload
        - proof_witness
      x-agid-non-claims:
        - not-production-carrier-traffic
        - not-real-label-purchase
        - not-delivery-guarantee
        - not-live-rate-comparison
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipshipShipmentCreateRequest'
            examples:
              cheapestSynthetic:
                summary: Safe synthetic shipment creation request
                value:
                  recipientId: ship_recipient_synthetic_001
                  addressFormVersion: wallet_country_form_ref_synthetic_001
                  parcelProfileRef: parcel_profile_synthetic_small_box_001
                  walletConsentRef: consent_synthetic_skipship_001
                  servicePreference: cheapest
                  requestedAt: '2026-07-03T00:00:00.000Z'
      responses:
        '201':
          description: Synthetic shipment refs created by the sandbox Delivery Gateway facade.
          headers:
            skipship-idempotency-key:
              $ref: '#/components/headers/SkipshipIdempotencyKey'
            skipship-idempotency-replayed:
              $ref: '#/components/headers/SkipshipIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkipshipShipmentCreateResult'
        '400':
          description: Request contained missing refs or forbidden private material.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/hexaship/mvp-v0.1/shipments:
    post:
      operationId: createHexashipMvpV01Shipment
      tags:
        - Delivery Gateway Carrier API
      summary: Run the Hexaship MVP v0.1 DHL/UPS sandbox shipment flow.
      description: >
        Stripe-style shipment creation facade for the Vey/Hexaship MVP. The
        merchant sends an EC order ref, Address Wallet recipient ID, wallet
        consent ref, parcel profile ref, and a selection mode. The sandbox
        resolves the recipient by ID, compares safe DHL/UPS candidates, selects
        fastest or cheapest, creates a label ref, records a tracking alias, and
        emits normalized webhook ledger entries. This endpoint is local sandbox
        evidence only and does not purchase real DHL or UPS labels.
      x-agid-contract-id: hexaship-mvp-v0.1-create-shipment
      x-agid-source-contract: src/lib/hexashipDeliveryGateway.ts#runHexashipMvpV01Sandbox
      x-agid-redacted-fields:
        - raw_address
        - recipient_name
        - recipient_phone
        - carrier_api_key
        - carrier_credential
        - raw_label_payload
        - raw_tracking_payload
        - proof_witness
        - proof_secret
        - private_key
      x-agid-non-claims:
        - local-sandbox-only
        - not-real-dhl-or-ups-purchase
        - not-live-rate-comparison
        - not-delivery-guarantee
        - not-raw-address-disclosure
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HexashipMvpV01ShipmentRequest'
            examples:
              cheapestWalletRecipient:
                summary: Safe MVP shipment request using an Address Wallet recipient ID
                value:
                  merchantRef: merchant_sandbox_vey_001
                  ecOrderRef: ec_order_sandbox_001
                  recipientId: ship_recipient_synthetic_001
                  addressFormVersion: wallet_country_form_ref_synthetic_001
                  parcelProfileRef: parcel_profile_synthetic_small_box_001
                  walletConsentRef: consent_synthetic_hexaship_001
                  carrierCapabilityRef: carrier_capability_synthetic_hexaship_001
                  selectionMode: cheapest
                  selectedBy: ec
                  requestedAt: '2026-07-04T00:00:00.000Z'
      responses:
        '201':
          description: Hexaship MVP sandbox shipment orchestration result.
          headers:
            skipship-idempotency-key:
              $ref: '#/components/headers/SkipshipIdempotencyKey'
            skipship-idempotency-replayed:
              $ref: '#/components/headers/SkipshipIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HexashipMvpV01ShipmentResult'
        '400':
          description: Request contained missing refs or forbidden private material.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/merchant-console/onboarding:
    post:
      operationId: createMerchantConsoleOnboarding
      tags:
        - Delivery Gateway Carrier API
      summary: Create a Merchant Console onboarding record from safe setup refs.
      description: >
        Captures the Stripe-like merchant setup flow for Hexaship without raw
        recipient address material, carrier credentials, raw carrier payloads,
        or webhook secrets. Address Wallet country-form selection is represented
        by `addressFormVersionRef`; carrier-specific address forms are blocked
        in EC and converted to DHL/UPS label payload shapes server-side only.
        EC Social Login setup is represented by `addressLoginClientRef` and an
        HTTPS callback URL preflight, without provider tokens or raw profiles.
      x-agid-contract-id: merchant-console-onboarding-v0.1
      x-agid-source-contract: src/lib/merchantConsoleEcPlugin.ts#buildMerchantConsoleEcPluginPlan
      x-agid-redacted-fields:
        - raw_address
        - address_line_1
        - address_line_2
        - recipient_name
        - recipient_phone
        - carrier_api_key
        - carrier_credential
        - raw_carrier_payload
        - raw_label_payload
        - webhook_secret
        - production_webhook_secret
        - proof_witness
        - proof_secret
        - private_key
        - provider_id_token
        - provider_access_token
        - provider_refresh_token
        - raw_provider_profile
      x-agid-non-claims:
        - not-raw-address-intake
        - not-proof-witness-intake
        - not-provider-token-intake
        - not-raw-carrier-payload-intake
        - not-live-carrier-credential
        - not-raw-address-disclosure
        - not-production-dhl-ups-traffic
        - not-carrier-specific-address-form
        - not-raw-address-callback
      x-agid-evidence-fixtures:
        preflightFixture: docs/specs/fixtures/merchant-console-onboarding-v0.1.json
        historyFixture: docs/specs/fixtures/merchant-console-onboarding-v0.1.json
        evidenceFixture: docs/specs/fixtures/merchant-console-onboarding-v0.1.json
        evidenceSchema: docs/specs/schemas/merchant-console-onboarding-v0.1.schema.json
        verifierCommand: npm run verify:merchant-console-ec-plugin
        aggregateVerifierCommand: npm run verify:address-login-spec
        managedServiceBoundary: delivery-gateway-carrier-api
        localOnly: true
        forbiddenMaterial:
          - raw_address
          - address_line_1
          - address_line_2
          - recipient_name
          - recipient_phone
          - carrier_api_key
          - carrier_credential
          - raw_carrier_payload
          - raw_label_payload
          - webhook_secret
          - production_webhook_secret
          - proof_witness
          - proof_secret
          - private_key
          - provider_id_token
          - provider_access_token
          - provider_refresh_token
          - raw_provider_profile
        nonClaims:
          - not-raw-address-intake
          - not-proof-witness-intake
          - not-provider-token-intake
          - not-raw-carrier-payload-intake
          - not-live-carrier-credential
          - not-raw-address-disclosure
          - not-production-dhl-ups-traffic
          - not-carrier-specific-address-form
