  /v1/delivery/webhooks/tracking:
    post:
      operationId: receiveDeliveryTrackingWebhook
      tags:
        - Delivery Gateway Carrier API
      summary: Receive a signed sandbox tracking webhook event.
      description: >
        Receives normalized, signed carrier tracking events as safe refs. This
        contract is for replay-safe webhook intake only; it does not accept raw
        carrier payloads, raw addresses, recipient contacts, carrier secrets, or
        proof witnesses in public fixtures.
      x-agid-contract-id: delivery-gateway-tracking-webhook
      x-agid-source-contract: src/lib/deliveryGatewayCarrierApi.ts#DELIVERY_GATEWAY_API_SURFACES.tracking-webhook
      x-agid-redacted-fields:
        - raw_tracking_payload
        - raw_address
        - recipient_name
        - recipient_phone
        - carrier_secret
        - proof_witness
      x-agid-non-claims:
        - not-raw-address-intake
        - not-proof-witness-intake
        - not-production-carrier-traffic
        - not-final-proof-of-delivery
      x-agid-event-idempotency:
        eventKey: eventId
        fingerprint: signed-normalized-body
        replayBehavior: ack-same-event
        conflictBehavior: reject-same-event-different-body
        replayWindowSeconds: 300
        minimumStoreTtlDays: 30
        deadLetterAfterAttempts: 12
        durableStoreRequiredForProduction: true
        blockedMaterial:
          - raw_address
          - recipient_phone
          - carrier_secret
          - proof_witness
          - raw_tracking_payload
      parameters:
        - $ref: '#/components/parameters/DeliveryWebhookSignature'
        - $ref: '#/components/parameters/DeliveryWebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingWebhookRequest'
            examples:
              syntheticInTransit:
                summary: Safe signed tracking event
                value:
                  eventId: evt_tracking_synthetic_001
                  carrierAlias: sandbox-carrier
                  trackingAlias: tracking_receipt_synthetic_001
                  status: in_transit
                  occurredAt: '2026-07-04T08:00:00.000Z'
      responses:
        '202':
          description: Tracking event accepted as a redacted lifecycle receipt.
          headers:
            skipship-webhook-event-replayed:
              $ref: '#/components/headers/SkipshipWebhookEventReplayed'
            skipship-webhook-event-attempt:
              $ref: '#/components/headers/SkipshipWebhookEventAttempt'
            skipship-webhook-event-expires-at:
              $ref: '#/components/headers/SkipshipWebhookEventExpiresAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingWebhookReceipt'
        '400':
          $ref: '#/components/responses/TrackingWebhookBadRequest'
        '401':
          $ref: '#/components/responses/TrackingWebhookUnauthorized'
        '409':
          $ref: '#/components/responses/TrackingWebhookConflict'
