        forbiddenPublicSchemaFields:
          - carrierHandoffRef
          - rawAddress
          - recipientPhone
          - carrierApiKey
          - proofWitness
          - privateKey
          - proofSecret
          - rawCarrierPayload
        nonClaims:
          - not-public-api-field
          - not-merchant-visible-receipt
          - not-raw-address-material
          - not-production-carrier-traffic
          - not-real-label-purchase
      x-agid-redacted-fields:
        - raw_address
        - recipient_name
        - recipient_phone
        - proof_witness
        - private_key
        - raw_label_payload
        - carrier_api_key
      responses:
        '200':
          description: Synthetic sandbox carrier smoke refs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxCarrierSmokeSummary'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional replay-safety key supplied by SDKs or server integrations.
        Sandbox routes replay the same response for the same method, path, key,
        and body, and return 409 if the same key is reused with a different body.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9_:-]+$'
    DeliveryWebhookSignature:
      name: Skipship-Signature
      in: header
      required: true
      description: Detached signature over the timestamp and normalized webhook body.
      schema:
        type: string
        pattern: '^t=[0-9]+,v1=[A-Fa-f0-9]{64}$'
    DeliveryWebhookTimestamp:
      name: Skipship-Timestamp
      in: header
      required: true
      description: Unix timestamp used for replay-window validation.
      schema:
        type: string
        pattern: '^[0-9]{10,}$'
  headers:
    SkipshipIdempotencyKey:
      description: Echoes the accepted Idempotency-Key when present.
      schema:
        type: string
    SkipshipIdempotencyReplayed:
      description: Indicates whether the response was replayed from the sandbox idempotency registry.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    SkipshipWebhookEventReplayed:
      description: Indicates whether the tracking webhook receipt was replayed from the event idempotency registry.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    SkipshipWebhookEventAttempt:
      description: Count of accepted attempts observed for this tracking webhook eventId.
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    SkipshipWebhookEventExpiresAt:
      description: ISO timestamp after which the sandbox event idempotency entry may be evicted.
      schema:
        type: string
        format: date-time
  responses:
    IdempotencyConflict:
      description: The same Idempotency-Key was reused for the same endpoint with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdempotencyConflictError'
    TrackingWebhookBadRequest:
      description: Request contained missing refs or forbidden private material.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidTrackingWebhookBodyError'
              - $ref: '#/components/schemas/RejectedPrivateMaterialError'
    TrackingWebhookUnauthorized:
      description: Missing or invalid webhook signature.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackingWebhookSignatureError'
    TrackingWebhookConflict:
      description: Event fingerprint has already been accepted or conflicts with a prior event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackingWebhookConflictError'
  schemas:
    MerchantConsoleOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - merchantAccount
        - storeEcPlatform
        - shippingPreferences
        - addressWalletSettings
        - apiKeysAndWebhooks
      properties:
        merchantAccount:
          type: object
          additionalProperties: false
          required:
            - displayName
            - adminUserRef
            - businessProfileRef
            - billingProfileRef
            - twoFactorEnabled
          properties:
            displayName:
              type: string
            adminUserRef:
              type: string
              pattern: '^admin_user_ref_[a-z0-9_:-]+$'
            businessProfileRef:
              type: string
              pattern: '^business_profile_ref_[a-z0-9_:-]+$'
            billingProfileRef:
              type: string
              pattern: '^billing_profile_ref_[a-z0-9_:-]+$'
            twoFactorEnabled:
              type: boolean
              const: true
        storeEcPlatform:
          type: object
          additionalProperties: false
          required:
            - storeRef
            - platformStoreRef
            - platform
            - orderSchemaRef
            - addressLoginClientRef
            - addressLoginCallbackUrl
            - currency
            - timezone
          properties:
            storeRef:
              type: string
              pattern: '^store_ref_[a-z0-9_:-]+$'
            platformStoreRef:
              type: string
              pattern: '^platform_store_ref_[a-z0-9_:-]+$'
            platform:
              type: string
              enum:
                - shopify-like
                - woocommerce
                - ec-cube
                - custom-ec
            orderSchemaRef:
              type: string
              pattern: '^order_schema_ref_[a-z0-9_:-]+$'
            addressLoginClientRef:
              type: string
              description: Vey ID / Address Login client ref. This is not a provider token.
              pattern: '^address_login_client_ref_[a-z0-9_:-]+$'
            addressLoginCallbackUrl:
              type: string
              format: uri
              description: HTTPS callback URL that must pass Address Login callback preflight before live enablement.
              pattern: '^https://'
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
            timezone:
              type: string
        shippingPreferences:
          type: object
          additionalProperties: false
          required:
            - carrierPolicyRef
            - enabledCarriers
            - selectionRule
            - parcelProfileRefs
            - labelFormat
            - returnsEnabled
          properties:
            carrierPolicyRef:
              type: string
              pattern: '^carrier_policy_ref_[a-z0-9_:-]+$'
            enabledCarriers:
              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - dhl
                  - ups
            selectionRule:
              type: string
              enum:
                - cheapest
                - fastest
                - balanced
                - merchant-manual
                - user-choice
            parcelProfileRefs:
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^parcel_profile_ref_[a-z0-9_:-]+$'
            labelFormat:
              type: string
              enum:
                - pdf
                - zpl
                - qr
            returnsEnabled:
              type: boolean
        addressWalletSettings:
          type: object
          additionalProperties: false
          required:
            - walletPolicyRef
            - recipientApprovalPolicyRef
            - addressFormVersionRef
            - carrierSpecificAddressShapeBlocked
            - hideAddressFromBuyer
            - friendDeliveryEnabled
            - addressWalletLoginEnabled
            - qrRailPolicyRef
          properties:
            walletPolicyRef:
              type: string
              pattern: '^wallet_policy_ref_[a-z0-9_:-]+$'
            recipientApprovalPolicyRef:
              type: string
              pattern: '^recipient_approval_policy_ref_[a-z0-9_:-]+$'
            addressFormVersionRef:
              type: string
              description: Safe Address Wallet country-form version ref. This is not raw address material.
              pattern: '^wallet_country_form_ref_[a-z0-9_:-]+$'
            carrierSpecificAddressShapeBlocked:
              type: boolean
              const: true
              description: EC must not collect DHL/UPS-specific address shapes; Gateway performs server-side label mapping.
            hideAddressFromBuyer:
              type: boolean
              const: true
            friendDeliveryEnabled:
              type: boolean
            addressWalletLoginEnabled:
              type: boolean
            qrRailPolicyRef:
              type: string
              pattern: '^qr_rail_policy_ref_[a-z0-9_:-]+$'
        apiKeysAndWebhooks:
          type: object
          additionalProperties: false
          required:
            - apiKeySetRef
            - testPublishableKeyRef
            - testSecretKeyRef
            - webhookEndpointRef
            - webhookEventRefs
            - productionReviewRef
          properties:
            apiKeySetRef:
              type: string
              pattern: '^api_key_set_ref_[a-z0-9_:-]+$'
            testPublishableKeyRef:
              type: string
              pattern: '^pk_test_ref_[a-z0-9_:-]+$'
            testSecretKeyRef:
              type: string
              pattern: '^sk_test_ref_[a-z0-9_:-]+$'
            webhookEndpointRef:
              type: string
              pattern: '^webhook_endpoint_ref_[a-z0-9_:-]+$'
            webhookEventRefs:
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^webhook_event_ref_[a-z0-9_:-]+$'
            productionReviewRef:
              type: string
              pattern: '^production_review_ref_[a-z0-9_:-]+$'
    MerchantConsoleOnboardingResult:
      type: object
      additionalProperties: false
      required:
        - onboardingRef
        - merchantRef
        - safeOutputRefs
        - localOnly
        - productionTraffic
        - blockedMaterial
        - requiredNextAction
        - addressLoginBoundary
      properties:
        onboardingRef:
          type: string
          pattern: '^merchant_onboarding_ref_[a-z0-9_:-]+$'
        merchantRef:
          type: string
          pattern: '^merchant_[a-z0-9_:-]+$'
        safeOutputRefs:
          type: array
          minItems: 1
          items:
            type: string
        localOnly:
          type: boolean
          const: true
        productionTraffic:
          type: boolean
          const: false
        blockedMaterial:
          type: array
          items:
            type: string
        requiredNextAction:
          type: string
          enum:
            - issue_test_keys
            - run_sandbox_shipment
            - submit_limited_production_review
        addressLoginBoundary:
          type: object
          additionalProperties: false
          required:
            - addressLoginClientRef
            - addressLoginCallbackUrl
            - addressLoginCallbackPreflightRef
            - callbackContractVersion
            - callbackUrlHttps
            - forbiddenCallbackParamsAbsent
            - rawAddressCallbackBlocked
          properties:
            addressLoginClientRef:
              type: string
              pattern: '^address_login_client_ref_[a-z0-9_:-]+$'
            addressLoginCallbackUrl:
              type: string
              format: uri
              pattern: '^https://'
            addressLoginCallbackPreflightRef:
              type: string
              pattern: '^address_login_callback_preflight_ref_[a-z0-9_:-]+$'
            callbackContractVersion:
              type: string
            callbackUrlHttps:
              type: boolean
              const: true
            forbiddenCallbackParamsAbsent:
              type: boolean
              const: true
            rawAddressCallbackBlocked:
              type: boolean
              const: true
    IdempotencyConflictError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - message
      properties:
        ok:
          const: false
        error:
          const: idempotency_key_conflict
        message:
          type: string
    InvalidTrackingWebhookBodyError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - message
      properties:
        ok:
          const: false
        error:
          const: invalid_tracking_webhook_body
        message:
          type: string
    RejectedPrivateMaterialError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - rejectedKeys
        - message
      properties:
        ok:
          const: false
        error:
          const: private_material_rejected
        rejectedKeys:
          type: array
          items:
            type: string
            enum:
              - rawAddress
              - recipientName
              - recipientPhone
              - phone
              - carrierApiKey
              - carrierCredential
              - commercialRateSecret
              - rawLabelPayload
              - proofWitness
              - privateKey
              - proofSecret
        message:
          type: string
    TrackingWebhookSignatureError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - message
      properties:
        ok:
          const: false
        error:
          type: string
          enum:
            - missing_signature
            - malformed_signature
            - timestamp_mismatch
            - signature_mismatch
        message:
          type: string
    TrackingWebhookConflictError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - message
      properties:
        ok:
          const: false
        error:
          const: tracking_webhook_event_conflict
        message:
          type: string
    DeliveryObjective:
      type: string
      enum:
        - fastest
        - cheapest
        - balanced
        - risk-minimized
    SkipshipServicePreference:
      type: string
      enum:
        - fastest
        - cheapest
        - balanced
    ShipmentIntentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - merchantRef
        - recipientTokenRef
        - parcelProfileRef
        - addressValidationRef
      properties:
        merchantRef:
          type: string
        recipientTokenRef:
          type: string
          pattern: '^(rectok_|recipient_token_)[a-z0-9_:-]+$'
        parcelProfileRef:
          type: string
          pattern: '^parcel_profile_[a-z0-9_:-]+$'
        addressValidationRef:
          type: string
          pattern: '^(addrval_|address_validation_)[a-z0-9_:-]+$'
        walletConsentRef:
          type: string
          pattern: '^(consent_|wallet_consent_)[a-z0-9_:-]+$'
        servicePreference:
          $ref: '#/components/schemas/SkipshipServicePreference'
        requestedAt:
          type: string
          format: date-time
    ShipmentIntentResult:
      type: object
      additionalProperties: false
      required:
        - version
        - intent_id
        - merchant_ref
        - recipient_token_ref
        - parcel_profile_ref
        - service_preference
        - address_validation_ref
        - wallet_consent_ref
        - status
        - required_next_action
        - privacy
        - blocked_material
        - local_only
        - non_claims
      properties:
        version:
          const: shipment-intent-v0.1
        intent_id:
          type: string
          pattern: '^shipintent_sandbox_[0-9a-f]{8}$'
        merchant_ref:
          type: string
        recipient_token_ref:
          type: string
        parcel_profile_ref:
          type: string
        service_preference:
          $ref: '#/components/schemas/SkipshipServicePreference'
        address_validation_ref:
          type: string
        wallet_consent_ref:
          type: string
        status:
          type: string
          enum:
            - requires_wallet_consent
            - ready_for_rate_quote
        required_next_action:
          type: string
          enum:
            - request_wallet_consent
            - quote_rates
        privacy:
          type: object
          additionalProperties: false
          required:
            - contains_raw_address
            - production_traffic
            - carrier_credentials_present
            - log_safe
          properties:
            contains_raw_address:
              const: false
            production_traffic:
              const: false
            carrier_credentials_present:
              const: false
            log_safe:
              const: true
        blocked_material:
          type: array
          items:
            type: string
        local_only:
          const: true
        non_claims:
          type: array
          minItems: 1
          items:
            type: string
    ServiceLevel:
      type: string
      enum:
        - economy
        - standard
        - express
        - same-day
    RateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - addressAliasRef
        - parcelProfileRef
        - objective
        - requestedServiceLevels
      properties:
        addressAliasRef:
          type: string
          pattern: '^(addr_alias_|address_alias_)[a-z0-9_:-]+$'
        parcelProfileRef:
          type: string
          pattern: '^parcel_profile_[a-z0-9_:-]+$'
        objective:
          $ref: '#/components/schemas/DeliveryObjective'
        requestedServiceLevels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceLevel'
        policyRef:
          type: string
    RateQuoteResult:
      type: object
      additionalProperties: false
      required:
        - rateRef
        - carrierAlias
        - serviceLevel
        - objective
        - etaWindow
        - priceQuote
        - capabilityWarnings
      properties:
        rateRef:
          type: string
          pattern: '^rate_[0-9a-f]{24}$'
        carrierAlias:
          type: string
        serviceLevel:
          $ref: '#/components/schemas/ServiceLevel'
        objective:
          $ref: '#/components/schemas/DeliveryObjective'
        etaWindow:
          type: object
          additionalProperties: false
          required:
            - earliest
            - latest
          properties:
            earliest:
              type: string
              format: date-time
            latest:
              type: string
              format: date-time
        priceQuote:
          type: object
          additionalProperties: false
          required:
            - amount
            - currency
          properties:
            amount:
              type: number
              minimum: 0
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
        capabilityWarnings:
          type: array
          items:
            type: string
    CarrierAllocationRequest:
      type: object
      additionalProperties: false
      required:
        - rateRef
        - walletConsentRef
        - objective
        - merchantPolicyRef
      properties:
        rateRef:
          type: string
          pattern: '^rate_[0-9a-f]{24}$'
        walletConsentRef:
          type: string
          pattern: '^(consent_|wallet_consent_)[a-z0-9_:-]+$'
        objective:
          $ref: '#/components/schemas/DeliveryObjective'
        merchantPolicyRef:
          type: string
    CarrierAllocationResult:
      type: object
      additionalProperties: false
      required:
        - allocationRef
        - selectedCarrierAlias
        - objective
        - selectionReasonCodes
      properties:
        allocationRef:
          type: string
          pattern: '^alloc_[0-9a-f]{24}$'
        selectedCarrierAlias:
          type: string
        objective:
          $ref: '#/components/schemas/DeliveryObjective'
        selectionReasonCodes:
          type: array
          minItems: 1
          items:
            type: string
    SkipshipShipmentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - recipientId
        - parcelProfileRef
        - walletConsentRef
      properties:
        merchantRef:
          type: string
        recipientId:
          type: string
          pattern: '^(ship_recipient_|wallet_recipient_|recipient_)[a-z0-9_:-]+$'
        addressFormVersion:
          type: string
          description: Address Wallet country-form version ref. This is not raw address material.
          pattern: '^wallet_country_form_ref_[a-z0-9_:-]+$'
        parcelProfileRef:
          type: string
          pattern: '^parcel_profile_[a-z0-9_:-]+$'
        walletConsentRef:
          type: string
          pattern: '^(consent_|wallet_consent_)[a-z0-9_:-]+$'
        servicePreference:
          $ref: '#/components/schemas/SkipshipServicePreference'
        requestedAt:
          type: string
          format: date-time
    SkipshipShipmentRefs:
      type: object
      additionalProperties: false
      required:
        - rateRef
        - allocationRef
        - labelRef
        - trackingReceiptRef
        - deliveryProofRef
      properties:
        rateRef:
          type: string
          pattern: '^rate_[0-9a-f]{24}$'
        allocationRef:
          type: string
          pattern: '^alloc_[0-9a-f]{24}$'
        labelRef:
          type: string
          pattern: '^label_[0-9a-f]{24}$'
        trackingReceiptRef:
          type: string
          pattern: '^tracking_receipt_[0-9a-f]{24}$'
        deliveryProofRef:
          type: string
          pattern: '^delivery_proof_[0-9a-f]{24}$'
    SkipshipShipmentCreateResult:
      type: object
      additionalProperties: false
      required:
        - shipmentId
        - apiVersion
        - developerCall
        - status
        - servicePreference
        - carrierAlias
        - recipientId
        - safeRefs
        - webhookEvents
        - blockedMaterial
        - localOnly
        - productionTraffic
        - rawAddressFixtures
        - nonClaims
        - validationErrors
      properties:
        shipmentId:
          type: string
          pattern: '^ship_[0-9a-f]{24}$'
        apiVersion:
          type: string
          const: delivery-gateway-carrier-api-v0.1
        developerCall:
          type: string
          const: shipping.createShipment
        status:
          type: string
          const: sandbox_label_ready
        servicePreference:
          $ref: '#/components/schemas/SkipshipServicePreference'
        carrierAlias:
          type: string
          const: sandbox-carrier
        recipientId:
          type: string
        safeRefs:
          $ref: '#/components/schemas/SkipshipShipmentRefs'
        webhookEvents:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - shipment.created
              - shipment.rated
              - shipment.label_created
              - shipment.in_transit
              - shipment.delivered
        blockedMaterial:
          type: array
          items:
            type: string
        localOnly:
          type: boolean
          const: true
        productionTraffic:
          type: boolean
          const: false
        rawAddressFixtures:
          type: boolean
          const: false
        nonClaims:
          type: array
          items:
            type: string
        validationErrors:
          type: array
          items:
            type: string
    HexashipMvpSelectionMode:
      type: string
      enum:
        - fastest
        - cheapest
    HexashipMvpV01ShipmentRequest:
      type: object
      additionalProperties: false
      required:
        - merchantRef
        - ecOrderRef
        - recipientId
        - parcelProfileRef
        - walletConsentRef
        - carrierCapabilityRef
        - selectionMode
      properties:
        merchantRef:
          type: string
          pattern: '^merchant_[a-z0-9_:-]+$'
        ecOrderRef:
          type: string
          pattern: '^ec_order_[a-z0-9_:-]+$'
        recipientId:
          type: string
          pattern: '^(ship_recipient_|wallet_recipient_|recipient_)[a-z0-9_:-]+$'
        addressFormVersion:
          type: string
          description: Address Wallet country-form version ref used before server-side DHL/UPS label mapping.
          pattern: '^wallet_country_form_ref_[a-z0-9_:-]+$'
        parcelProfileRef:
          type: string
          pattern: '^parcel_profile_[a-z0-9_:-]+$'
        walletConsentRef:
          type: string
          pattern: '^(consent_|wallet_consent_)[a-z0-9_:-]+$'
        carrierCapabilityRef:
          type: string
          pattern: '^carrier_capability_[a-z0-9_:-]+$'
        selectionMode:
          $ref: '#/components/schemas/HexashipMvpSelectionMode'
        selectedBy:
          type: string
          enum:
            - user
            - ec
        requestedAt:
          type: string
          format: date-time
    HexashipMvpRateCandidate:
      type: object
      additionalProperties: false
      required:
        - carrier
        - rateRef
        - serviceLevel
        - priceMinor
        - currency
        - etaMinutes
        - priceEstimateRef
        - etaWindowRef
      properties:
        carrier:
          type: string
          enum:
            - dhl
            - ups
        rateRef:
          type: string
          pattern: '^rate_[0-9a-f]{24}$'
        serviceLevel:
          type: string
          enum:
            - economy
            - express
        priceMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
            - JPY
            - USD
        etaMinutes:
          type: integer
          minimum: 1
        priceEstimateRef:
          type: string
          pattern: '^price_estimate_[0-9a-f]{24}$'
        etaWindowRef:
          type: string
          pattern: '^eta_window_[0-9a-f]{24}$'
    HexashipMvpWebhookLedgerEntry:
      type: object
      additionalProperties: false
      required:
        - eventRef
        - eventType
        - shipmentRef
        - trackingAlias
        - status
        - receivedAt
        - rawPayloadStored
      properties:
        eventRef:
          type: string
          pattern: '^evt_[0-9a-f]{24}$'
        eventType:
          type: string
          enum:
            - shipment.created
            - rates.created
            - carrier.selected
            - label.created
            - shipment.in_transit
        shipmentRef:
          type: string
          pattern: '^ship_[0-9a-f]{24}$'
        trackingAlias:
          type: string
          pattern: '^tracking_[0-9a-f]{24}$'
        status:
          type: string
          enum:
            - created
            - rated
            - label_created
            - in_transit
            - delivered
            - return_created
        receivedAt:
          type: string
          format: date-time
        rawPayloadStored:
          type: boolean
          const: false
    HexashipMvpV01ShipmentResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - version
        - flow
        - ecOrderRef
        - recipientResolution
        - capability
        - shipment
        - candidates
        - selection
        - label
        - tracking
        - webhookLedger
        - privacy
        - localOnly
        - productionTraffic
        - nonClaims
      properties:
        ok:
          type: boolean
          const: true
        version:
          type: string
          const: hexaship-mvp-v0.1
        flow:
          type: string
          const: ec-request-wallet-id-rates-select-label-track-webhook
        ecOrderRef:
          type: string
        recipientResolution:
          type: object
          additionalProperties: false
          required:
            - recipientId
            - addressResolved
            - walletConsentRef
            - addressAliasRef
          properties:
            recipientId:
              type: string
            addressResolved:
              type: boolean
              const: true
            walletConsentRef:
              type: string
            addressAliasRef:
              type: string
              pattern: '^addr_alias_[0-9a-f]{24}$'
        capability:
          type: object
          additionalProperties: false
          required:
            - carrierCapabilityRef
            - requiredNextAction
            - localOnly
          properties:
            carrierCapabilityRef:
              type: string
              pattern: '^carrier_capability_[a-z0-9_:-]+$'
            requiredNextAction:
              type: string
              const: getRates
            localOnly:
              type: boolean
              const: true
        shipment:
          type: object
          additionalProperties: false
          required:
            - shipmentRef
            - merchantRef
            - parcelProfileRef
            - status
          properties:
            shipmentRef:
              type: string
              pattern: '^ship_[0-9a-f]{24}$'
            merchantRef:
              type: string
            parcelProfileRef:
              type: string
            status:
              type: string
              const: label_created
        candidates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/HexashipMvpRateCandidate'
        selection:
          type: object
          additionalProperties: false
          required:
            - mode
            - selectedBy
            - selectedCarrier
            - selectedRateRef
            - reason
          properties:
            mode:
              $ref: '#/components/schemas/HexashipMvpSelectionMode'
            selectedBy:
              type: string
              enum:
                - user
                - ec
            selectedCarrier:
              type: string
              enum:
                - dhl
                - ups
            selectedRateRef:
              type: string
            reason:
              type: string
        label:
          type: object
          additionalProperties: false
          required:
            - labelRef
            - carrier
            - created
          properties:
            labelRef:
              type: string
