        historyFixture: docs/specs/fixtures/delivery-gateway-sandbox-carrier-smoke-v0.1.json
        evidenceFixture: docs/specs/fixtures/delivery-gateway-sandbox-carrier-smoke-v0.1.json
        evidenceSchema: docs/specs/schemas/delivery-gateway-sandbox-carrier-smoke-v0.1.schema.json
        verifierCommand: npm run verify:delivery-gateway-carrier-api
