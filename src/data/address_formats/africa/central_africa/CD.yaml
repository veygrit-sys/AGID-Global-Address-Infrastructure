countryCode: CD
name: DR Congo
native:
  name: RD Congo
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{subLocality}}
    {{locality}}
    {{postcode}} {{province}}
    RÉPUBLIQUE DÉMOCRATIQUE DU CONGO
  ordering: small-to-big
  fields:
    - { key: recipient, label: Nom complet, placeholder: Nom du destinataire, required: true, type: text }
    - { key: street, label: Voie et numéro, placeholder: Avenue et numéro, required: true, type: text }
    - { key: subLocality, label: Quartier / secteur / village, placeholder: Quartier ou secteur, required: false, type: text }
    - { key: locality, label: Commune / territoire, placeholder: Commune ou territoire, required: true, type: text }
    - { key: postcode, label: Code postal, placeholder: '1004131', required: true, type: text }
    - { key: province, label: Ville-province / province, placeholder: KINSHASA, required: true, type: text }
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{subLocality}}
    {{locality}}
    {{postcode}} {{province}}
    DEMOCRATIC REPUBLIC OF THE CONGO
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full name, placeholder: Addressee, required: true, type: text }
    - { key: street, label: Street and premises, placeholder: Street and number, required: true, type: text }
    - { key: subLocality, label: Neighbourhood / sector / village, placeholder: Neighbourhood or sector, required: false, type: text }
    - { key: locality, label: Commune / territory, placeholder: Commune or territory, required: true, type: text }
    - { key: postcode, label: Postcode, placeholder: '1004131', required: true, type: text }
    - { key: province, label: City-province / province, placeholder: KINSHASA, required: true, type: text }
postalCode:
  format: NNNNNNN
  regex: ^\d{7}$
  api: https://codepostal.cd/backend/public/api/address/list-by-postal-code
  source: SCPT Code Postal RDC directory / UPU Congo (Dem. Rep.) addressing sheet 09/2022
openSourceIds: [scpt-rdc-postcode-directory, upu-dr-congo-addressing-2022, arptc-dr-congo-postal-market-2021-2022, osm-dr-congo, hf-libpostal-address-parser-candidate, osm-nominatim, osm-overpass, openaddresses, geonames-postal, geonames-gazetteer, geoboundaries, upu-addressing, hot-osm-africa, openstreetmap-wiki-africa, humdata-africa, openaerialmap, digital-earth-africa-dem, digital-earth-africa-coastlines, digital-earth-africa-waterbodies, digital-earth-africa-wofs, digital-earth-africa-fractional-cover, digital-earth-africa-geomad, fao-wapor, esa-worldcover, gebco-bathymetry, gmrt-topography, global-mangrove-watch, allen-coral-atlas, protected-planet-wdpa, gbif-occurrence, rcmrd-gmes-africa-geoportal]
addressRules:
  languages: [{ code: fr, name: French }]
  deliveryLanguages: [{ code: fr, name: French }]
  nativeOrder: [recipient, street, subLocality, locality, postcode, province, country]
  englishOrder: [recipient, street, subLocality, locality, postcode, province, country]
  regionalHierarchy: [provinceOrCityProvince, cityOrTownship, townshipOrTerritory, sectorOrNeighbourhood, deliveryAreaOrPostOffice, typedSevenDigitPostcode, officialPostalSurfaceOrNoCanonicalGeometry, explicitAddressLinkedBuilding, agidCell]
  postalCode:
    label: 7 digits to the left of the province or city-province name
    required: true
    usage: SCPT assignment; parsed segments alone do not prove an assignment, delivery area, building or Polygon/MultiPolygon
