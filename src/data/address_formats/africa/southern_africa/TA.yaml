    {{recipient}}
    {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
    Tristan da Cunha
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: House number and street name
      required: true
      type: text
    - key: suburb
      label: Locality
      placeholder: ""
      required: false
      type: text
    - key: city
      label: Settlement
      placeholder: Edinburgh of the Seven Seas
      required: true
      type: text
