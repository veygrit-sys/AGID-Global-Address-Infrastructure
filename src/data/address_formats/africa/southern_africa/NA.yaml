countryCode: NA
name: Namibia
native:
  name: English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{internalRouting}}
    {{deliveryPoint}}
    {{subLocality}}
    {{locality}}
    {{deliveryPostOffice}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full Name, placeholder: Synthetic Recipient, required: true, type: text }
    - { key: organization, label: Organization / Unit, placeholder: Synthetic Organization / Department, type: text }
    - { key: internalRouting, label: Building / Complex / Floor / Unit, placeholder: Synthetic Building / internal routing, type: text }
    - { key: deliveryPoint, label: Delivery Point, placeholder: PO Box / Private Bag / number and street / local area, required: true, type: text }
    - { key: subLocality, label: Sub-locality, placeholder: Synthetic Sub-locality, type: text }
    - { key: locality, label: Locality / Village, placeholder: Synthetic Locality, type: text }
    - { key: deliveryPostOffice, label: Delivery Post Office / Postal Area, placeholder: Synthetic Delivery Office, required: true, type: text }
    - { key: postcode, label: Postcode, placeholder: "99099", required: true, type: text }
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{internalRouting}}
    {{deliveryPoint}}
    {{subLocality}}
    {{locality}}
    {{deliveryPostOffice}}
    {{postcode}}
    NAMIBIA
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full Name, placeholder: Synthetic Recipient, required: true, type: text }
    - { key: organization, label: Organization / Unit, placeholder: Synthetic Organization / Department, type: text }
    - { key: internalRouting, label: Building / Complex / Floor / Unit, placeholder: Synthetic Building / internal routing, type: text }
    - { key: deliveryPoint, label: Delivery Point, placeholder: PO Box / Private Bag / number and street / local area, required: true, type: text }
    - { key: subLocality, label: Sub-locality, placeholder: Synthetic Sub-locality, type: text }
    - { key: locality, label: Locality / Village, placeholder: Synthetic Locality, type: text }
    - { key: deliveryPostOffice, label: Delivery Post Office / Postal Area, placeholder: Synthetic Delivery Office, required: true, type: text }
    - { key: postcode, label: Postcode, placeholder: "99099", required: true, type: text }
postalCode:
  format: NNNNN Phase 1; third digit zero
  regex: ^\d{2}0\d{2}$
  api: https://www.nampost.com.na/postal/postal-codes
  source: NamPost current five-digit delivery-network directory; Phase 1 codes explicitly do not cover administrative or geographic areas
addressRules:
  languages:
    - { code: en, name: English }
  deliveryLanguages:
    - { code: en, name: English }
  nativeOrder: [name, organization, organizationUnit, buildingOrComplex, floor, unit, deliveryPoint, streetOrLocalArea, subLocality, localityOrVillage, deliveryPostOfficeOrPostalArea, postcode, country]
  englishOrder: [name, organization, organizationUnit, buildingOrComplex, floor, unit, deliveryPoint, streetOrLocalArea, subLocality, localityOrVillage, deliveryPostOfficeOrPostalArea, postcode, country]
  regionalHierarchy:
    - region
    - constituency
    - localAuthorityOrSettlement
    - localityOrVillage
    - postalRegion
    - postalArea
    - deliveryPostOffice
    - phase1FiveDigitDeliveryNetworkCodeWithNoCanonicalPostalGeometry
    - poBoxPrivateBagPosteRestanteOrPhysicalDeliveryPoint
    - explicitRightsClearedCivicAddressPoint
    - explicitAddressLinkedBuilding
    - agidCell
  postalCode:
    label: 5 digits; third digit is zero in Phase 1; code identifies delivery infrastructure and not an area
    required: true
    usage: required
