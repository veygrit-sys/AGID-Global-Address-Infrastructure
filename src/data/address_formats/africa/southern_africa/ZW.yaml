    - key: suburb
      label: Suburb
      placeholder: Avondale
      required: false
      type: text
    - key: city
      label: City / Town
      placeholder: Harare
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.zimpost.co.zw/
  source: Zimbabwe Posts official portal / Zimpost
addressRules:
  languages:
