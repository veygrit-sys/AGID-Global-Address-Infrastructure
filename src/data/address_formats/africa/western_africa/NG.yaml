countryCode: NG
name: Nigeria
native:
  name: English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{building}}
    {{houseNumber}} {{street}}
    {{district}}
    {{city}} {{postcode}}
    {{lga}}
    {{state}}
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full Name, placeholder: Synthetic Recipient, required: true, type: text }
    - { key: organization, label: Organization, placeholder: Example Organization, type: text }
    - { key: building, label: Building / floor / unit, placeholder: "Example Building, floor 2, unit 4", type: text }
    - { key: houseNumber, label: Plot/House Number, placeholder: "45", type: text }
    - { key: street, label: Street Address, placeholder: Example Crescent, required: true, type: text }
    - { key: district, label: District / Area, placeholder: Synthetic District, type: text }
    - { key: city, label: City / Town / Locality, placeholder: Synthetic Locality, required: true, type: text }
    - { key: postcode, label: Postcode, placeholder: "999996", required: true, type: text }
    - { key: lga, label: Local Government Area, placeholder: Synthetic LGA, type: text }
    - { key: state, label: State / FCT, placeholder: Synthetic State / FCT, required: true, type: text }
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{building}}
    {{houseNumber}} {{street}}
    {{district}}
    {{city}} {{postcode}}
    {{lga}}
    {{state}}
    NIGERIA
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full Name, placeholder: Synthetic Recipient, required: true, type: text }
    - { key: organization, label: Organization, placeholder: Example Organization, type: text }
    - { key: building, label: Building / floor / unit, placeholder: "Example Building, floor 2, unit 4", type: text }
    - { key: houseNumber, label: Plot/House Number, placeholder: "45", type: text }
    - { key: street, label: Street Address, placeholder: Example Crescent, required: true, type: text }
    - { key: district, label: District / Area, placeholder: Synthetic District, type: text }
    - { key: city, label: City / Town / Locality, placeholder: Synthetic Locality, required: true, type: text }
    - { key: postcode, label: Postcode, placeholder: "999996", required: true, type: text }
    - { key: lga, label: Local Government Area, placeholder: Synthetic LGA, type: text }
    - { key: state, label: State / FCT, placeholder: Synthetic State / FCT, required: true, type: text }
postalCode:
  format: NNNNNN current; 11-character alphanumeric from 2026-10-01 with effective assignment evidence
  regex: ^(?:\d{6}|(?=[A-Z0-9]*[A-Z])(?=[A-Z0-9]*\d)[A-Z0-9]{11})$
  api: https://www.postcode.gov.ng/
  source: NIPOST current numeric mail-postcode reference plus scheduled National Digital Alphanumeric Postcode; syntax never proves a live assignment, official polygon, exact address or building
addressRules:
  languages:
    - { code: en, name: English }
  nativeOrder: [name, organization, building, floor, unit, houseNumber, street, districtOrArea, locality, postcode, lga, stateOrFct, country]
  englishOrder: [name, organization, building, floor, unit, houseNumber, street, districtOrArea, locality, postcode, lga, stateOrFct, country]
  regionalHierarchy:
    - stateOrFct
    - lga
    - wardOrRegistrationArea
    - districtOrLocality
    - currentNumericSixDigitAssignment
    - futureDigitalElevenCharacterAssignmentAfterEffectiveDate
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
    - agidCell
  postalCode:
    label: 6 digits current; 11-character digital code only after 2026-10-01 and current NIPOST assignment evidence; P.O. Box/PMB are separate
    required: true
    usage: required
  deliveryLanguages:
    - { code: en, name: English }
