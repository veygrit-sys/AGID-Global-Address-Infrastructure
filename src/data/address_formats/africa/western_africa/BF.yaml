countryCode: BF
name: Burkina Faso
native:
  name: Burkina Faso
  addressFormat: |-
    {{recipient}}
    {{premise}}
    {{street}}
    {{subLocality}}
    {{deliveryService}}
    {{postcode}} {{city}}
    BURKINA FASO
  ordering: small-to-big
  fields:
    - key: recipient
      label: Nom Complet
      placeholder: Ibrahim Traoré
      required: true
      type: text
    - key: premise
      label: Appartement / Immeuble
      placeholder: Domicile 1114
      required: false
      type: text
    - key: street
      label: Numéro et voie
      placeholder: 566 Avenue de la Nation
      required: true
      type: text
    - key: subLocality
      label: Quartier / Village / Repère
      placeholder: Dapoya
      required: false
      type: text
    - key: deliveryService
      label: BP / BV / Poste restante et agence
      placeholder: BP 6000 OUAGA CNT
      required: false
      type: text
    - key: postcode
      label: Code postal
      placeholder: '10000'
      required: false
      type: text
    - key: city
      label: Ville
      placeholder: Ouagadougou
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{premise}}
    {{street}}
    {{subLocality}}
    {{deliveryService}}
    {{postcode}} {{city}}
    BURKINA FASO
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Ibrahim Traoré
      required: true
      type: text
    - key: premise
      label: Apartment / Building
      placeholder: Domicile 1114
      required: false
      type: text
    - key: street
      label: House number and street
      placeholder: 566 Avenue de la Nation
      required: true
      type: text
    - key: subLocality
      label: Neighbourhood / Village / Landmark
      placeholder: Dapoya
      required: false
      type: text
    - key: deliveryService
      label: PO box / Virtual box / Poste restante and office
      placeholder: BP 6000 OUAGA CNT
      required: false
      type: text
    - key: postcode
      label: Postcode
      placeholder: '10000'
      required: false
      type: text
    - key: city
      label: City
      placeholder: Ouagadougou
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://laposte.bf/code-postal/
  source: La Poste Burkina Faso live five-digit reference search and UPU Burkina Faso addressing sheet (12/2021); reference access does not establish a reusable complete assignment register or postal-area geometry licence
addressRules:
  languages:
    - code: fr
      name: French
  nativeOrder:
    - recipient
    - premise
    - street
    - subLocality
    - deliveryService
    - postcode
    - city
    - country
  englishOrder:
    - recipient
    - premise
    - street
    - subLocality
    - deliveryService
    - postcode
    - city
    - country
  regionalHierarchy:
    - region
    - province
    - commune
    - quarterOrVillage
    - postalOfficeOrAgency
    - typedFiveDigitPostcode
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
    - agidCell
  postalCode:
    label: 5 digits; commune, quartier and agency objects remain distinct; validate current La Poste assignment; no automatic polygon or building
    required: false
    usage: used
  deliveryLanguages:
    - code: fr
      name: French
