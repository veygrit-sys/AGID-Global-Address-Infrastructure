countryCode: GM
name: Gambia
native:
  name: Gambia
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Gambia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Adama Barrow
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: 123 Banjul Rd
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Banjul
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Gambia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Adama Barrow
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: 123 Banjul Rd
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Banjul
      required: true
      type: text
postalCode:
  format: NNN
  regex: ^\d{3}$
  api: https://gambiapost.gm/
  source: Gambia Postal Services Corporation
addressRules:
  languages:
    - code: en
      name: English
  nativeOrder:
    - region
    - district
    - town
    - street
    - houseNumber
    - country
  englishOrder:
    - region
    - district
    - town
    - street
    - houseNumber
    - country
  regionalHierarchy:
    - region
  postalCode:
    label: 3 digits used
    required: false
    usage: used
  deliveryLanguages:
    - code: en
      name: English
