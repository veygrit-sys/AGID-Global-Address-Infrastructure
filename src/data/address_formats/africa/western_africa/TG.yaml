countryCode: TG
name: Togo
native:
  name: Togo
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Togo
  ordering: small-to-big
  fields:
    - key: recipient
      label: Nom Complet
      placeholder: Faure Gnassingbé
      required: true
      type: text
    - key: street
      label: Adresse / BP
      placeholder: BP 123
      required: true
      type: text
    - key: city
      label: Ville
      placeholder: Lomé
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Togo
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Faure Gnassingbé
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City
      placeholder: Lomé
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.laposte.tg/bureaux-poste
  source: Societe des Postes du Togo
addressRules:
  languages:
