countryCode: CV
name: Cape Verde
native:
  name: Cabo Verde
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Nome Completo
      placeholder: José Maria Neves
      required: true
      type: text
    - key: street
      label: Endereço
      placeholder: Rua da Praia, 123
      required: true
      type: text
    - key: postcode
      label: Código Postal
      placeholder: "7600"
      required: false
      type: text
    - key: city
      label: Cidade / Ilha
      placeholder: Praia
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Cape Verde
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: José Maria Neves
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: 123 Praia St
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "7600"
      required: false
      type: text
    - key: city
      label: City / Island
      placeholder: Praia
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://correios.cv/faq
  source: Correios de Cabo Verde / UPU August 2026 / CIP / INGT IDE-CV
addressRules:
  languages:
    - code: pt
      name: Portuguese
  nativeOrder:
    - island
    - municipality
    - parish
    - locality
    - street
    - houseNumber
    - country
  englishOrder:
    - island
    - municipality
    - parish
    - locality
    - street
    - houseNumber
    - country
  regionalHierarchy:
    - island
    - municipality
    - parish
    - localityOrZone
    - typedFourDigitPostcode
    - operatorPublishedExtendedIdentifier
    - privateCIPOrNoCIP
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitRightsClearedAddress
    - explicitRightsClearedBuildingOrParcel
  postalCode:
    label: 4 digits are the canonical UPU postcode length; operator-published NNNN-NNN values and georeferenced CIP remain separate identifiers until an explicit mapping is pinned
    required: false
    usage: used
  deliveryLanguages:
    - code: pt
      name: Portuguese
