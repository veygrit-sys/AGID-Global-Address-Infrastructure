countryCode: SS
name: South Sudan
native:
  name: South Sudan
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    South Sudan
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: John Lado
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: Juba Street
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Juba
      required: true
      type: text
