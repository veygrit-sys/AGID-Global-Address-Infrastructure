    - key: street
      label: Street Address / PO Box
      placeholder: Juba Street
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Juba
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: null
  source: South Sudan National Communication Authority postal and courier sector oversight
