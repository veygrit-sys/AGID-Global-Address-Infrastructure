      placeholder: John Mukasa
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Kampala
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://ugapost.co.ug/our-services/physical-address/
  source: Posta Uganda physical address service
addressRules:
  languages:
    - code: en
      name: English
    - code: sw
      name: Swahili
