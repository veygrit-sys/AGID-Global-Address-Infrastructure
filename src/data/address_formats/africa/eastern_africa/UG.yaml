countryCode: UG
name: Uganda
native:
  name: Uganda
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Uganda
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: John Mukasa
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Kampala
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Uganda
  ordering: small-to-big
  fields:
    - key: recipient
