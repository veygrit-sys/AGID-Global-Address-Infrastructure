countryCode: SO
name: Somalia
native:
  name: Soomaaliya
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Somalia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Magaca oo Full
      placeholder: Axmed Cali
      required: true
      type: text
    - key: street
      label: Cinwaanka
      placeholder: Wadada Maka Al-Mukarama
      required: true
      type: text
    - key: city
      label: Magaalada
      placeholder: Muqdisho
      required: true
      type: text
    - key: postcode
      label: Boostada
      placeholder: BN 03010
      required: false
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Somalia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Ahmed Ali
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: Maka Al-Mukarama Rd
      required: true
      type: text
    - key: city
      label: City
      placeholder: Mogadishu
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: BN 03010
      required: false
      type: text
postalCode:
  format: AA NNNNN
  regex: ^[A-Z]{2}\s?\d{5}$
  api: https://moct.gov.so/en/posta/
  source: Somalia MOCT Postal Service and May 2025 revival / Cabinet National Postal Policy 2025-2030 / Somali Bureau of Standards public BN03010 observation / MOCT digital-addressing programme / SNBS GIS / NIRA principles / OSM Somalia
addressRules:
  languages:
    - code: so
      name: Somali
    - code: ar
      name: Arabic
    - code: en
      name: English
  nativeOrder:
    - name
    - street
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - federalOrTerritorialScope
    - federalMemberStateOrAdministration
    - region
    - district
    - cityOrMunicipality
    - localityOrNeighbourhood
    - roadAndPremise
    - typedObservedPostcodeOrNoCode
    - poBoxSeparate
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - agidCell
  postalCode:
    label: Observed AA plus five digits; optional and non-universal; verify assignment and semantics; P.O. Box and address/building links remain separate
    required: false
    usage: used
