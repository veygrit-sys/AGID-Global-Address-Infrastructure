countryCode: MG
name: Madagascar
native:
  name: Madagasikara
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{deliveryPoint}}
    {{building}}
    {{houseNumber}} {{street}}
    {{quarter}}
    {{postcode}} {{city}}
    MADAGASIKARA
  ordering: small-to-big
  fields:
    - { key: recipient, label: Anarana feno, placeholder: Mpandray synthétique, required: true, type: text }
    - { key: organization, label: Fikambanana, placeholder: Fikambanana ohatra, type: text }
    - { key: deliveryPoint, label: Boaty paositra / toerana fanaterana, placeholder: B.P. 999, type: text }
    - { key: building, label: Trano / rihana / efitra, placeholder: "Trano ohatra, rihana 2", type: text }
    - { key: houseNumber, label: Laharana lot / trano, placeholder: Lot 99, type: text }
    - { key: street, label: Lalana, placeholder: Lalana Ohatra, type: text }
    - { key: quarter, label: Fokontany / faritra, placeholder: Fokontany synthétique, type: text }
    - { key: postcode, label: Kaody paositra, placeholder: "699", required: true, type: text }
    - { key: city, label: Tanàna / biraon'ny paositra, placeholder: Tanàna synthétique, required: true, type: text }
    - { key: region, label: Faritra administratif (toe-javatra), placeholder: Faritra synthétique, type: text }
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{deliveryPoint}}
    {{building}}
    {{houseNumber}} {{street}}
    {{quarter}}
    {{postcode}} {{city}}
    MADAGASCAR
  ordering: small-to-big
  fields:
    - { key: recipient, label: Full Name, placeholder: Synthetic Recipient, required: true, type: text }
    - { key: organization, label: Organization, placeholder: Example Organization, type: text }
    - { key: deliveryPoint, label: P.O. Box / delivery point, placeholder: B.P. 999, type: text }
    - { key: building, label: Building / floor / unit, placeholder: "Example Building, floor 2", type: text }
    - { key: houseNumber, label: Lot / house number, placeholder: Lot 99, type: text }
    - { key: street, label: Street, placeholder: Example Street, type: text }
    - { key: quarter, label: Fokontany / quarter, placeholder: Synthetic Fokontany, type: text }
    - { key: postcode, label: Postcode, placeholder: "699", required: true, type: text }
    - { key: city, label: Postal town / locality, placeholder: Synthetic Postal Town, required: true, type: text }
    - { key: region, label: Current administrative region (context), placeholder: Synthetic Region, type: text }
postalCode:
  format: "NNN (dated UPU 2011: historical province digit plus two department/Fivondronana digits; current assignment evidence required)"
  regex: ^[1-6]\d{2}$
  api: https://www.paositramalagasy.mg/
  source: Current Paositra Malagasy operator site plus dated UPU format; no reviewed current nationwide assignment artifact, canonical boundary dataset or blanket redistribution licence
addressRules:
  languages:
    - { code: mg, name: Malagasy }
    - { code: fr, name: French }
  nativeOrder: [recipient, organization, deliveryPointOrPhysicalAddress, building, floor, unit, lotOrHouseNumber, street, fokontanyOrQuarter, postcode, postalTown, country]
  englishOrder: [recipient, organization, deliveryPointOrPhysicalAddress, building, floor, unit, lotOrHouseNumber, street, fokontanyOrQuarter, postcode, postalTown, country]
  regionalHierarchy: [country, historicalProvinceSemantics, currentRegion, currentDistrict, commune, fokontanyOrLocality, paositraThreeDigitAssignment, officialPostalSurfaceOrNoCanonicalGeometry, explicitCivicAddressPoint, explicitAddressLinkedBuildingFeature, exactRightsClearedBuilding, agidCell]
  postalCode:
    label: 3 digits before the postal town; current operator assignment required; B.P. identifier and historical administration are separate
    required: true
    usage: required
  deliveryLanguages:
    - { code: mg, name: Malagasy }
    - { code: fr, name: French }
