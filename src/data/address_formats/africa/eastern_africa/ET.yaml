countryCode: ET
name: Ethiopia
native:
  name: ኢትዮጵያ
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: ሙሉ ስም
      placeholder: አበበ ቢቂላ
      required: true
      type: text
    - key: street
      label: የመንገድ ስም / የቤት ቁጥር
      placeholder: ፖ.ሳ.ቁ 1234
      required: true
      type: text
    - key: postcode
      label: የፖስታ ኮድ
      placeholder: "1000"
      required: false
      type: text
    - key: city
      label: ከተማ
      placeholder: አዲስ አበባ
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Ethiopia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Abebe Bikila
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 1234
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "1000"
      required: false
      type: text
    - key: city
      label: City
      placeholder: Addis Ababa
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://ethio.post/branches/
  source: Ethiopost / UPU Ethiopia 2002 / SSGI eDAS / Ethio-NSDI
addressRules:
  languages:
    - code: en
      name: English
    - code: am
      name: Amharic
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - region
    - zone
    - woredaOrSubCity
    - kebeleOrNeighborhood
    - typedFourDigitPostalObject
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitEDASAddress
    - explicitEDASBuildingOrParcelFeature
    - exactRightsClearedBuilding
  postalCode:
    label: 4 digits kept as text when assigned; dated UPU hierarchy and current operator input do not establish a polygon; eDAS building resolution requires an explicit rights-cleared address relation
    required: false
    usage: used
openSourceIds:
  - ethiopost-branches
  - ethiopost-delivery-address-form
