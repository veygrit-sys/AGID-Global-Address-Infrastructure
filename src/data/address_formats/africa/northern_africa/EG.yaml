countryCode: EG
name: Egypt
native:
  name: مصر
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{district}}
    {{city}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: الاسم الكامل
      placeholder: أحمد محمد
      required: true
      type: text
    - key: street
      label: اسم الشارع / رقم العقار
      placeholder: ١٢ شارع النيل
      required: true
      type: text
    - key: district
      label: الحي / المنطقة
      placeholder: الزمالك
      required: false
      type: text
    - key: city
      label: المدينة / المحافظة
      placeholder: القاهرة
      required: true
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: ١١٥١١
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{district}}
    {{city}}
    {{postcode}}
    Egypt
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Ahmed Mohamed
      required: true
      type: text
    - key: street
      label: Street Name / Building No.
      placeholder: 12 Nile St
      required: true
      type: text
    - key: district
      label: District
      placeholder: Zamalek
      required: false
      type: text
    - key: city
      label: City / Governorate
      placeholder: Cairo
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "0000000"
      required: true
      type: text
postalCode:
  format: NNNNNNN
  regex: ^\d{7}$
  api: https://www.egyptpost.org/
  source: UPU Egypt Postal Addressing System (July 2023) / Egypt Post GIS / CAPMAS / Egyptian Survey Authority
addressRules:
  languages:
    - code: ar
      name: Arabic
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - governorate
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - governorate
    - country
  regionalHierarchy:
    - governorate
    - locality
    - neighbourhood
    - community
    - sevenDigitPostcode
    - officialPostalAreaOrNoCanonicalGeometry
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
  postalCode:
    label: 7 digits; province 2, locality 1, neighbourhood 2, community 2. Legacy values need an authoritative crosswalk; codes and GPS results are not automatic official polygons, and buildings need explicit links.
    required: true
    usage: required
  openSourceIds:
    - egy-list
    - datahub-postal
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - hot-osm-africa
    - openstreetmap-wiki-africa
