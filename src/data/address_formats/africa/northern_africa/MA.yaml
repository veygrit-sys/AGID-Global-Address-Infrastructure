countryCode: MA
name: Morocco
native:
  name: المغرب
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: الاسم الكامل
      placeholder: محمد علي
      required: true
      type: text
    - key: street
      label: العنوان
      placeholder: ١٢٣ شارع محمد الخامس
      required: true
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: ١٠٠٠٠
      required: true
      type: text
    - key: city
      label: المدينة
      placeholder: الرباط
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Morocco
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Mohamed Ali
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: 123 Blvd Mohammed V
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "10000"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Rabat
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.codepostal.ma/search.aspx
  source: UPU / Barid Al-Maghrib / Morocco Open Data / ANCFCC
addressRules:
  languages:
    - code: ar
      name: Arabic
    - code: fr
      name: French
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - province
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - province
    - country
  regionalHierarchy:
    - region
    - provinceOrPrefecture
    - commune
    - localityOrDistrict
    - typedFiveDigitPostcode
    - officialHomeDeliverySectorOrNoCanonicalGeometry
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
  postalCode:
    label: "5 digits: 0/1/7/8 home-delivery sector; 2–6 agency/centre; 9 large-volume recipient; assignment is not automatically a polygon and exact building needs an explicit link"
    required: true
    usage: required
  openSourceIds:
