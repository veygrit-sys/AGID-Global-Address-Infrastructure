countryCode: TN
name: Tunisia
native:
  name: تونس
  addressFormat: |-
    {{recipient}}
    {{building}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    {{delegation}}
    {{governorate}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: الاسم الكامل
      placeholder: ياسين بن صالح
      required: true
      type: text
    - key: building
      label: المبنى / المدخل / الدرج / الشقة
      placeholder: مبنى تجريبي، مدخل أ، الطابق ٢
      type: text
    - key: houseNumber
      label: رقم المبنى
      placeholder: "٤٥"
      type: text
    - key: street
      label: العنوان
      placeholder: شارع الحبيب بورقيبة
      required: true
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: ١٠٠٠
      required: true
      type: text
    - key: city
      label: المحلية / مكتب أو مركز التوزيع
      placeholder: تونس
      required: true
      type: text
    - key: delegation
      label: المعتمدية
      placeholder: معتمدية تجريبية
      type: text
    - key: governorate
      label: الولاية
      placeholder: تونس
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{building}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    {{delegation}}
    {{governorate}}
    TUNISIA
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Yassine Ben Salah
      required: true
      type: text
    - key: building
      label: Building / entrance / staircase / unit
      placeholder: Example Building, entrance A, floor 2
      type: text
    - key: houseNumber
      label: Building or street number
      placeholder: "45"
      type: text
    - key: street
      label: Street Address
      placeholder: Ave Habib Bourguiba
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "1000"
      required: true
      type: text
    - key: city
      label: Locality / delivery office or centre
      placeholder: Tunis
      required: true
      type: text
    - key: delegation
      label: Delegation
      placeholder: Synthetic Delegation
      type: text
    - key: governorate
      label: Governorate
      placeholder: Tunis
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.poste.tn/codes.php
  source: La Poste Tunisienne current search plus UPU Tunisia April 2014 addressing semantics; four-digit syntax does not prove a current assignment, catchment, address or building
addressRules:
  languages:
    - code: ar
      name: Arabic
    - code: fr
      name: French
  nativeOrder:
    - name
    - building
    - entrance
    - staircase
    - floor
    - unit
    - houseNumber
    - street
    - postcode
    - localityOrDeliveryOffice
    - delegation
    - governorate
    - country
  englishOrder:
    - name
    - building
    - entrance
    - staircase
    - floor
    - unit
    - houseNumber
    - street
    - postcode
    - localityOrDeliveryOffice
    - delegation
    - governorate
    - country
  regionalHierarchy:
    - governorate
    - delegation
    - communeOrLocality
    - deliveryOfficeOrCentre
    - officialFourDigitAssignment
    - officialPostalSurfaceOrNoCanonicalGeometry
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
    - agidCell
  postalCode:
    label: 4 digits; current La Poste assignment required; no automatic polygon or building
    required: true
    usage: required
