countryCode: IO
name: British Indian Ocean Territory
native:
  name: British Indian Ocean Territory
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{city}}
    {{postcode}}
    British Indian Ocean Territory
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: organization
      label: Unit
      placeholder: e.g. US Navy Support Facility
      required: true
      type: text
    - key: city
      label: Military Base
      placeholder: Diego Garcia
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: BBND 1ZZ
      required: true
      type: text
