countryCode: NZ
name: New Zealand
native:
  name: English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: "123"
    - key: street
      label: Street
      placeholder: Queen St
    - key: suburb
      label: Suburb
      placeholder: Auckland Central
    - key: city
      label: City
      placeholder: Auckland
    - key: postcode
      label: Postcode
      placeholder: "1010"
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{postcode}}
    NEW ZEALAND
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: houseNumber
      label: No.
      placeholder: "123"
    - key: street
      label: St./Rd. (Latin)
      placeholder: Queen St
    - key: suburb
      label: Suburb
      placeholder: Auckland Central
    - key: city
      label: City
      placeholder: Auckland
    - key: postcode
      label: Postcode
      placeholder: "1010"
      required: true
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.nzpost.co.nz/personal/sending-in-nz/postcodes
  source: NZ Post postcode network; LINZ NZ Addresses
addressRules:
  languages:
    - code: en
      name: English
  nativeOrder:
    - recipient
    - street
    - suburb
    - city
    - postcode
    - country
  englishOrder:
    - recipient
    - street
    - suburb
    - city
    - postcode
    - country
  regionalHierarchy:
    - cityOrRegion
  postalCode:
    label: 4 digits required
    required: true
    usage: required
  openSourceIds:
    - linz-nz-addresses
    - nz-post-postcode-network
    - linz-nz-building-outlines
