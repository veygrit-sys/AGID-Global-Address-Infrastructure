countryCode: KI
name: Kiribati
native:
  name: Kiribati
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Kiribati
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: John Doe
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City/Town
      placeholder: Tarawa
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: KI0000
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Kiribati
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: Island / Delivery Post Office
      placeholder: Sth Tarawa
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: KI0107
      required: true
      type: text
postalCode:
  format: AA9999
  regex: ^KI\d{4}$
  source: Kiribati Postal Services / UPU POST*CODE
addressRules:
  languages:
    - code: en
      name: English
    - code: gil
      name: Gilbertese
  nativeOrder:
    - recipient
    - street
    - village
    - island
    - postcode
    - country
  englishOrder:
    - recipient
    - street
    - village
    - island
    - postcode
    - country
  regionalHierarchy:
    - island
  postalCode:
    label: KI plus 4 digits required
    required: true
    usage: required
