  postalCode:
    label: NNNNNN
    required: true
    usage: Use the six-digit official code composed of province, planning district and postal zone. A current permitted MINTEL lookup may provide time-bound assignment evidence, but a valid string, rendered map boundary, DINARP catalog field, INEC census feature, IGM layer, municipal parcel, containment, proximity or model surface is not automatically an official reusable postal polygon or an exact building relation. Keep official observations, derived geometry and unknown coverage distinct. Building display requires an explicit civic-address-ID-to-building-ID relation, and AGID remains an independent versioned crosswalk.
