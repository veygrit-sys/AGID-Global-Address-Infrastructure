addressRules:
  languages:
    - code: es
      name: Spanish
    - code: en
      name: English
  deliveryLanguages:
    - code: es
      name: Spanish
  nativeOrder: &a2
    - recipient
    - attention
    - organization
    - street
    - houseNumber
    - addressRemainder
    - villageOrSettlement
    - premises
    - floor
    - unit
    - poBox
    - postOffice
    - commune
    - region
    - postcode
    - country
  englishOrder: *a2
  regionalHierarchy:
    - country
    - region
    - province
    - commune
    - postal_distribution_area
    - block_face_or_commune_postal_object
    - civic_address
    - building_or_unit
  postalCode:
    label: NNNNNNN (postal distribution area + block face)
    required: true
    usage: Use only a current seven-digit CorreosChile result tied to a sufficiently specified address and commune, or a release explicitly licensed for that purpose. UPU identifies the first three digits as a postal distribution area, usually a commune, and the last four as a sequential block-face identifier; some localities use a commune fallback and P.O. boxes use the post-office code. The code is address-range-first and is not automatically a polygon. No national reusable official polygon release is bundled. A road-side range, buffer, interpolation, Voronoi, IDE, INE, SUBDERE, SII, community, API-cache or model surface remains derived and cannot fill unknown official coverage. Never infer a municipal number, exact civic address, building, floor, apartment, organization, person, owner, occupant or delivery entitlement from postcode containment. Building display requires an explicit rights-cleared stable civic-address-ID-to-building-ID relation. AGID remains an independent versioned spatial crosswalk.
  openSourceIds: *a3
