countryCode: GY
name: Guyana
native:
  name: English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{houseNumber}} {{street}} {{premises}}
    {{subdistrict}}
    {{city}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full name
      placeholder: ""
    - key: organization
      label: Company
      placeholder: ""
    - key: houseNumber
      label: Lot/House No.
      placeholder: "45"
    - key: street
      label: Street
      placeholder: Brickdam
    - key: premises
      label: Apartment / Premises
      placeholder: ""
    - key: subdistrict
      label: Area
      placeholder: Stabroek
    - key: city
      label: Town/City
      placeholder: Georgetown
    - key: postcode
      label: Postcode (7 digits)
      placeholder: "4130106"
      required: true
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{houseNumber}} {{street}} {{premises}}
    {{subdistrict}}
    {{city}}
    {{postcode}}
    GUYANA
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full name
      placeholder: ""
    - key: organization
      label: Building / Company
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: "45"
    - key: street
      label: Street
      placeholder: Brickdam
    - key: premises
      label: Apartment / Premises
      placeholder: ""
    - key: subdistrict
      label: Neighborhood / Area
      placeholder: Stabroek
    - key: city
      label: City / Town
      placeholder: Georgetown
    - key: postcode
      label: Postcode (7 digits)
      placeholder: "4130106"
      required: true
openSourceIds:
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - zippopotam
  - noaa-etopo
  - geobc-global-multi-resolution-topography
  - hydrosheds
  - protected-planet-wdpa
  - gbif-occurrence
  - esa-worldcover
  - usgs-3dep
  - nrcan-geospatial
  - conabio-geoportal
  - ibge-geosciences
  - inpe-terrabrasilis
postalCode:
  format: NNNNNNN
  regex: ^\d{7}$
  api: https://guypost.gy/find-your-postcode/
  source: Guyana Post Office Corporation / UPU Guyana addressing sheet 08/2025
addressRules:
  languages:
    - code: en
      name: English
  deliveryLanguages:
    - code: en
      name: English
  nativeOrder:
    - name
    - organization
    - street
    - premises
    - subdistrict
    - city
    - postcode
    - country
  englishOrder:
    - name
    - organization
    - street
    - premises
    - subdistrict
    - city
    - postcode
    - country
  regionalHierarchy:
    - region
    - town
  postalCode:
    label: NNNNNNN
    required: true
    usage: >-
      Current GPOC assignment is seven digits. Preserve the official row as a
      source-specific assignment; the reviewed table contains one six-digit
      anomaly (120101), and the UPU sheet includes a six-digit P.O. Box example
      (413018), neither of which may be coerced into a seven-digit postal-area
      polygon.
  openSourceIds:
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - zippopotam
    - noaa-etopo
    - geobc-global-multi-resolution-topography
    - hydrosheds
    - protected-planet-wdpa
    - gbif-occurrence
    - esa-worldcover
    - usgs-3dep
    - nrcan-geospatial
    - conabio-geoportal
    - ibge-geosciences
    - inpe-terrabrasilis
