    label: "NNNNN-NNN (Correios typed CEP object)"
    required: true
    usage: "Use an authorized, time-bound Correios Busca CEP response or a licensed DNE release as assignment evidence. Display eight digits as NNNNN-NNN; the API query form uses eight digits without punctuation. Treat every full CEP as area-or-non-area: a locality-area object may become derived-review geometry only through an exact, time-compatible, rights-cleared boundary crosswalk, while a logradouro or number range, building, large user, Correios unit, locker or pickup point, P.O. box, community mailbox, organization or unknown object is not automatically a polygon. ViaCEP and BrasilAPI are third-party candidate evidence. CNEFE address points and CEP aggregates preserve NV_GEO_COORD or equivalent positional quality and are not official Correios polygons, exact building footprints or delivery proof. Never infer a house number, complement, unit, person, owner, occupant or exact building from CEP containment. Building display requires a rights-cleared stable civic-address-ID-to-building-ID relation. AGID remains an independent versioned spatial crosswalk."
  openSourceIds:
    - "correios-cep-api"
