  postalCode:
    label: "NNNN (IPOSTEL delivery-network object)"
    required: true
    usage: "Use a time-bound IPOSTEL observation as national assignment evidence. The May 2019 UPU sheet establishes four digits: the first digit is the postal region and the remaining digits identify the delivery office. Treat a full code as delivery-network-first, not an automatic polygon. A delivery-office service area may become derived-review geometry only after an exact, time-compatible, rights-cleared routing or area crosswalk. An IPOSTEL page, UPU example, INE populated-place row, IGVSB or municipal boundary, cadastral parcel, road buffer, interpolation, Voronoi surface, third-party list or model output is not official postcode geometry. Never infer a street, house number, reference, unit, person, owner, occupant or exact building from postcode containment. Building display requires a rights-cleared stable civic-address-ID-to-building-ID relation. AGID remains an independent versioned spatial crosswalk."
