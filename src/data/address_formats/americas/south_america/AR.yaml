    usage: Use the current eight-character Correo Argentino CPA. In urban areas a CPA can identify a block face; small settlements, rural zones, P.O. Boxes and special objects can be non-area or share one code. The legacy four-digit CP is not current. A CPA, lookup, address point, parcel, containment, proximity or derived surface is not automatically an official polygon or exact building relation. Building display requires explicit evidence, and AGID remains an independent crosswalk.
