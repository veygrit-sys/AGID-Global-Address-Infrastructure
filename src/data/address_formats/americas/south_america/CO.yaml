    - street_and_placa
    - civic_address
    - construction_building_or_unit
  postalCode:
    label: NNNNNN (department + postal zone + district)
    required: true
    usage: Use only an exact six-digit 4-72 assignment or release feature. The first two digits identify the department, the next two the postal zone and the last two the district, but syntax alone is not current assignment proof. A digest-pinned feature from the official national Shapefile can be official release geometry only after the artifact-level open licence, attribution, update metadata, CRS, topology and normal-versus-expanded layer identity are verified and the ArcGIS all-rights-reserved conflict is resolved. DANE, IGAC, SINIC, cadastral, parcel, community, API or model objects cannot replace missing 4-72 postal geometry. Never infer a placa, exact civic address, building, apartment, organization, person, owner, occupant or delivery entitlement from postcode containment. Building display requires an explicit rights-cleared stable civic-address-ID-to-construction-ID relation. AGID remains an independent versioned spatial crosswalk.
