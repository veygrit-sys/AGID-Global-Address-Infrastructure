  postalCode:
    label: 5 digits or ZIP+4
    required: true
    usage: USPS 5-digit ZIP Codes and ZIP+4 are delivery-network, delivery-point, street, rural-route, highway-contract-route, P.O. Box, general-delivery, unique-organization, military, or inactive postal objects; area-or-non-area semantics apply and no polygon is presumed. Census ZCTA is an official-derived statistical approximation, not a USPS delivery boundary. A ZIP, ZIP+4, ZCTA, geocode, address point, parcel, building footprint, containment, or proximity never establishes an exact address-building relation. Building display requires an explicit rights-cleared civic-address identifier linked to a reviewed building identifier. Puerto Rico, Guam, U.S. Virgin Islands, American Samoa, Northern Mariana Islands, U.S. Minor Outlying Islands, and APO/FPO/DPO postal routing remain jurisdiction-explicit. AGID is an independent versioned spatial crosswalk.
