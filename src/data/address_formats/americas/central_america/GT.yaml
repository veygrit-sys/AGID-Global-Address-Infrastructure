    - attention
    - organization
    - houseNumber
    - street
    - neighborhood
    - premises
    - tower
    - apartment
    - kilometer
    - finca
    - lot
    - poBox
    - postcode
    - locality
    - municipality
    - department
    - country
  regionalHierarchy:
    - country
    - department
    - municipality
    - locality_or_rural_locality
    - urban_zone_or_neighborhood
    - five_digit_postcode
    - street_and_premises
    - civic_address
    - building_or_unit
  postalCode:
    label: NNNNN
    required: true
    usage: Use a five-digit value only with a pinned Correos de Guatemala directory artifact or time-bound operator observation. The November 2025 UPU sheet confirms structure and layout, but not every current assignment. A valid string, department prefix, municipality, Guatemala City zone, rural-locality label, SEGEPLAN or INE area, IGN map, RIC parcel, OSM object, containment, proximity or model surface is not automatically current postal assignment, official full-code polygon, exact civic address, building relation, occupant identity or delivery entitlement. Preserve zone, neighborhood, premises, tower, apartment, kilometre, finca and lot separately. Building display requires an explicit rights-cleared address-ID-to-building-ID relation; AGID remains an independent versioned crosswalk.
