  postalCode:
    label: NNNN
    required: true
    usage: Use the four-digit code only with time-bound assignment evidence from Correos de El Salvador or another permitted authoritative artifact. UPU records region, department, locality or delivery area and distribution semantics, but a valid string, locality label, CNR administrative boundary, ONEC statistical identifier, cadastral parcel, containment, proximity or model surface is not automatically an official reusable postal polygon or an exact building relation. Keep legacy municipalities and current districts versioned. Building display requires an explicit civic-address-ID-to-building-ID relation, and AGID remains an independent versioned crosswalk.
