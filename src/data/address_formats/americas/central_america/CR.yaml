  postalCode:
    label: NNNNN (province + canton + district)
    required: true
    usage: Use a five-digit value only with a pinned Correos de Costa Rica observation or versioned official assignment reference. The code structure is province digit plus two canton digits plus two district digits, but syntax or an administrative-code match alone is not current assignment proof. A district polygon may become official-derived postal geometry only after a one-to-one, time-compatible, rights-cleared crosswalk between the operator assignment and the exact INEC or IGN district release; SNIT content is reference-only where commercial direct or derived use is prohibited. Never infer a house number, exact address, building, unit, organization, person or delivery entitlement from postcode containment, administrative geometry, a landmark, coordinate, API cache or model. Building display requires an explicit rights-cleared civic-address-ID-to-building-ID relation. AGID remains an independent versioned spatial crosswalk.
