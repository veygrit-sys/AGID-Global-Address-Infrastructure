    - attention
    - organization
    - building
    - floor
    - unit
    - houseNumber
    - street
    - neighborhood
    - communalSectionOrQuarter
    - commune
    - arrondissement
    - department
    - postcode
    - city
    - country
  regionalHierarchy:
    - officialHtFourDigitAssignment
    - deliveryArea
    - commune
    - arrondissement
    - department
    - ihsiAdministrativeContextIndependentFromPostcode
    - cnigsReferenceGeometryIndependentFromPostcode
    - optionalDerivedPostalContextSurface
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
  postalCode:
    label: HT + 4 digits required for postal addressing
    required: true
    usage: "Office des Postes d’Haïti and UPU define HT plus four digits as one
      integral postcode, including domestic mail: digit 1 department, digit 2
      arrondissement, digit 3 commune and digit 4 delivery area. An operator
      lookup or release-pinned row can establish an assignment, but syntax, an
      example, an IHSI code or a place name cannot. No reusable nationwide
      operator postal-polygon release or licence is bundled. IHSI administrative
      codes/boundaries and CNIGS reference geography remain separate context and
      may become derived-review surfaces only through an explicit versioned
      postcode crosswalk, rights review, CRS/digest pinning and topology
      validation; they are never silently official postal geometry. A realtime
      lookup may validate an observation when terms, availability,
      request/response digest and observation time are recorded, but timeout or
      absence is not evidence of no assignment. Mathematical or ML surfaces may
      rank gaps, detect drift and compress validated geometry, never invent
      assignments, street numbers, units, buildings, people or delivery
      entitlement. Building display requires a rights-cleared stable
      civic-address identifier, a separately permitted building/footprint
      identifier and an explicit reviewed relation. AGID remains an independent
      spatial index and is not canonical Haitian postal geometry."
  openSourceIds: *a1
