postalCode:
  format: HTNNNN
  regex: ^HT\d{4}$
  api: https://laposte.gouv.ht/codes.php
  source: Office des Postes d’Haïti postcode search; UPU Haiti addressing sheet
    09/2017; IHSI territorial codes and 2024 administrative publication; CNIGS
    reference geodata; OpenStreetMap Haiti validation
addressRules:
  languages:
