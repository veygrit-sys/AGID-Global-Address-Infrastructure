  postalCode:
    label: BB + 5 digits; optional hyphen + 5-character building suffix
    required: true
    usage: Accept the legacy area form BBNNNNN and the updated building-linked form BBNNNNN-AAAAA. The BB prefix is integral. The 2014 UPU sheet and current BPS address guide establish the five-digit locality form, while the December 2024 Government launch states that the parish character is removed from the six-character BBID and the remaining five characters are appended to the old postcode. Do not synthesize the suffix, recover the omitted parish character, or present a syntax match as an assignment. A release-pinned BPS lookup may validate one neighbourhood or district observation. A release-pinned Lands and Surveys BBID feature may validate its explicit BuildingID, ShortPosta, LongPostal and building footprint relation, but public Query access and empty licence metadata are not bulk redistribution permission. Locality and parish layers are reference context, and paid Digimap roads, buildings or footprints are not open postal data. Building display requires that exact official feature relation or another rights-cleared stable address-to-building link; a legacy postcode area, locality, parish, coordinate, proximity, parcel, address string or model output is insufficient. Minimise household queries and retain terms, purpose, observed_at, validity, service version and digests. AGID remains an independent versioned spatial crosswalk.
