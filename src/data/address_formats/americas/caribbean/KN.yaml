native:
  name: English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    {{city}}
    {{state}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: "2"
    - key: street
      label: Street
      placeholder: Fern Street
    - key: subdistrict
      label: Locality subdivision
      placeholder: Greenlands
    - key: city
      label: Locality
      placeholder: Basseterre
    - key: state
      label: Island
      placeholder: St Kitts
    - key: postcode
      label: Postcode
      placeholder: KN0101
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    {{city}}
    {{state}}
    {{postcode}}
    SAINT KITTS AND NEVIS
  ordering: small-to-big
  fields:
    - key: organization
      label: Building / Company
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: "2"
    - key: street
      label: Street
      placeholder: Fern Street
    - key: subdistrict
      label: Locality subdivision
      placeholder: Greenlands
    - key: city
      label: Locality
      placeholder: Basseterre
    - key: state
      label: Island
      placeholder: St Kitts
    - key: postcode
      label: Postal Code
      placeholder: KN0101
      required: true
postalCode:
  format: KN9999
  regex: ^KN\d{4}$
  api: null
  source: Government of Saint Kitts and Nevis / SKNIS postal-code system and delivery-district list
    (updated 2017-04-26); UPU addressing sheet 12/2017
addressRules:
  languages:
    - code: en
      name: English
  deliveryLanguages:
    - code: en
      name: English
  nativeOrder:
    - name
    - organization
    - building
    - street
    - subdistrict
    - city
    - region
    - postcode
    - country
  englishOrder:
    - name
    - organization
    - building
    - street
    - subdistrict
    - city
    - region
    - postcode
    - country
  regionalHierarchy:
    - region
    - city
  postalCode:
    label: KN + 4 digits
    required: true
    usage: Use an integral KN plus four-digit value only with a current competent-authority assignment.
      The first two digits are the postal zone and the last two are the delivery district. The SKNIS
      article exposes 32 dated codes and prose street/locality membership, including special code
      KN7000, but it is not a versioned current assignment/alias/validity/exception denominator or
      polygon release. Do not turn islands, parishes, localities, streets, offices, routes, Points,
      buffers, hulls, cells or models into official postal areas. Derived or virtual geometry
      requires an explicit competent-authority code crosswalk, compatible rights, edition, CRS,
      topology, method, confidence and exceptions. Building display requires a separately
      rights-cleared civic-address identity, building identity and explicit relation. AGID remains
      an independent spatial index.
