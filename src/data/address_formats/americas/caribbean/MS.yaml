countryCode: MS
name: Montserrat
native:
  name: Montserrat
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{suburb}}
    {{district}}, {{postcode}}
    Montserrat
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: House number and street name
      required: true
      type: text
    - key: suburb
      label: Locality
      placeholder: ""
      required: false
      type: text
    - key: district
      label: Parish
      placeholder: e.g. Saint Anthony
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: MSR1110
      required: true
      type: text
