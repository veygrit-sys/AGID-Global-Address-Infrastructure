  regionalHierarchy:
    - region
    - city
  postalCode:
    label: MSR + 4 digits
    required: true
    usage: Use an integral MSR plus four-digit postcode only with a
      competent-authority assignment. The Government postcode guide lists eight
      active codes (MSR1110, MSR1120, MSR1210, MSR1230, MSR1250, MSR1310,
      MSR1330 and MSR1350), while the UPU 06/2026 sheet confirms the format and
      addressing position. The guide prose locality coverage is not
      Polygon/MultiPolygon geometry or a current versioned assignment, alias,
      validity, correction, exception and explicit non-area denominator. Do not
      turn parishes, localities, streets, post offices, P.O. boxes, routes,
      Points, buffers, hulls, cells or models into official postal areas.
      Derived or virtual geometry requires an explicit competent-authority
      postcode crosswalk, compatible rights, edition, CRS, topology, method,
      confidence and exceptions. Building display requires a separately
      rights-cleared civic-address identity, building identity and explicit
      relation. AGID remains an independent spatial index.
