countryCode: LK
name: Sri Lanka
native:
  name: ශ්‍රී ලංකාව
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: ගොඩනැගිල්ල/සමාගම
      placeholder: නෙළුම් කුළුණ
      required: false
      type: text
    - key: houseNumber
      label: නිවාස අංකය
      placeholder: "123"
      required: true
      type: text
    - key: street
      label: වීදිය
      placeholder: ගාලු පාර
      required: true
      type: text
    - key: suburb
      label: ප්‍රදේශය
      placeholder: කොල්ලුපිටිය
      required: false
      type: text
    - key: city
      label: නගරය
      placeholder: කොළඹ
      required: true
      type: text
    - key: postcode
      label: තැපැල් කේතය
      placeholder: "00300"
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Lotus Tower
      required: false
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "123"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Galle Road
      required: true
      type: text
    - key: suburb
      label: Area
      placeholder: Kollupitiya
      required: false
      type: text
    - key: city
      label: City
      placeholder: Colombo
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "00300"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://slpost.gov.lk/postcode_new/
  source: Sri Lanka Post public HTML explanation and lookup only; no verified machine API or bulk reuse licence. NSDI provides separate administrative metadata, not postal assignment.
addressRules:
  languages:
    - code: si
      name: Sinhala
    - code: ta
      name: Tamil
    - code: en
      name: English
  nativeOrder:
