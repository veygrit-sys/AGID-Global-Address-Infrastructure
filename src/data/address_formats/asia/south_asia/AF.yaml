postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: https://postalcode.afghanpost.gov.af/
  source: Afghan Post Postal Code System; UPU Afghanistan addressing sheet 07/2025; OCHA Afghanistan COD-AB 2026
addressRules:
  languages:
    - code: ps
      name: Pashto
    - code: fa-AF
      name: Dari
    - code: en
      name: English
  nativeOrder:
    - recipient
    - organization
    - houseNumber
    - streetOrThoroughfare
    - localityOrVillage
    - additionalDeliveryInformation
    - postcode
    - cityOrRuralDistrict
    - province
    - country
  englishOrder:
    - recipient
    - organization
    - houseNumber
    - streetOrThoroughfare
    - localityOrVillage
    - additionalDeliveryInformation
    - postcode
    - cityOrRuralDistrict
    - province
    - country
  regionalHierarchy:
    - provincePrefix10To43
    - cityDistrict01To50OrRuralDistrict51To99
    - postalDeliveryZone01To99
    - officialSixDigitPostalAssignment
    - afghanPostAddressPostOfficeOrPoBoxObject
    - officialPostalAreaGeometryWhenExactlyRightsCleared
    - administrativePcodeIndependentFromPostcode
    - optionalDerivedPostalAdministrativeJoinSurface
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
  postalCode:
    label: 6 digits required for postal addressing
    required: true
    usage: The six digits encode province, city or rural district, and postal delivery zone. Afghan Post map geometry is postal-area-first only when an exact current response or release, schema, rights, validity and digest are pinned. A postcode, address search, post office, P.O. Box, administrative P-code, OCHA boundary, coordinate, OSM feature or proximity does not independently prove a reusable polygon, exact civic address, building relation or delivery entitlement.
  openSourceIds:
    - afghan-post
    - afghan-postal-code-system
