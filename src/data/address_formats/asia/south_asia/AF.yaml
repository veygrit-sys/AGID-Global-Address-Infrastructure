countryCode: AF
name: Afghanistan
native:
  name: افغانستان
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{houseNumber}} {{streetOrThoroughfare}}
    {{localityOrVillage}}
    {{additionalDeliveryInformation}}
    {{postcode}} {{cityOrRuralDistrict}}
    {{province}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: گیرنده
      placeholder: ""
      required: false
      type: text
    - key: organization
      label: اداره/شرکت
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: نمبر خانه
      placeholder: ""
      required: false
      type: text
    - key: streetOrThoroughfare
      label: سرک/گذر
      placeholder: ""
      required: false
      type: text
    - key: localityOrVillage
      label: محل/قریه
      placeholder: ""
      required: true
      type: text
    - key: additionalDeliveryInformation
      label: معلومات اضافی تحویل
      placeholder: ""
      required: false
      type: text
    - key: cityOrRuralDistrict
      label: شهر/ولسوالی
      placeholder: ""
      required: true
      type: text
    - key: province
      label: ولایت
      placeholder: ""
      required: true
      type: text
    - key: postcode
      label: کد پستی شش رقمی
      placeholder: ""
      required: true
      type: text
    - key: poBox
      label: صندوق پستی
      placeholder: ""
      required: false
      type: text
    - key: civicAddressId
      label: شناسه آدرس مدنی
      placeholder: ""
      required: false
      type: text
    - key: buildingId
      label: شناسه تعمیر
      placeholder: ""
      required: false
      type: text
