    {{street}}
    {{city}}
    {{region}}
    竹島
    島根県隠岐郡隠岐の島町
    日本
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full name
      required: true
      type: text
    - key: street
      label: Street / Local address
      placeholder: Street, block, village, or landmark
      required: true
      type: text
    - key: city
      label: City / Locality
      placeholder: City or locality
      required: true
      type: text
    - key: region
      label: Region / Territory
      placeholder: Region
      required: false
      type: text
