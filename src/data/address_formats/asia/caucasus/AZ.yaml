countryCode: AZ
name: Azerbaijan
native:
  name: Azərbaycan
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{region}}
    Azərbaycan
  ordering: small-to-big
  fields:
    - key: recipient
      label: Ad
      placeholder: Tam ad
      required: true
      type: text
    - key: street
      label: Küçə
      placeholder: Küçə adı
      required: true
      type: text
    - key: houseNumber
      label: Ev nömrəsi
      placeholder: No
      required: true
      type: text
    - key: postcode
      label: Poçt indeksi
      placeholder: AZ1000
      required: true
      type: text
    - key: city
      label: Şəhər
      placeholder: Bakı
      required: true
      type: text
    - key: region
      label: Rayon
      placeholder: Abşeron
      required: false
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{region}}
    Azerbaijan
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Street name
      required: true
      type: text
    - key: houseNumber
      label: House No
      placeholder: No
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: AZ1000
      required: true
      type: text
    - key: city
      label: City/Town
      placeholder: Baku
      required: true
      type: text
    - key: region
      label: Region
      placeholder: Absheron
      required: false
      type: text
postalCode:
  format: AZNNNN
  regex: ^AZ\d{4}$
  api: https://www.azerpost.az/az/tez-tez-verilen-suallar/umumi-br-suallar/yasadigim-unvanin-poct-indeksini-nece-oyrene-bilerem
  source: Azərpoçt assignment with Azerbaijan Address Register (ÜRIS) and State Service cadastre
addressRules:
  languages:
    - code: az
      name: Azerbaijani
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - regionOrAutonomousRepublic
    - districtOrCity
    - locality
    - street
    - premise
  postalCode:
    label: AZNNNN; allocation requires source evidence and areas may be derived
    required: true
    usage: required
  openSourceIds:
    - azerpost-address-reference
    - azerbaijan-address-register
    - azerbaijan-state-committee-property
    - azerbaijan-open-data
    - geonames-azerbaijan
    - geonames-postal
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
