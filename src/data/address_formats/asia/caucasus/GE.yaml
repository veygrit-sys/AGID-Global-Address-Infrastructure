countryCode: GE
name: Georgia
native:
  name: საქართველო
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{region}}
    საქართველო
  ordering: small-to-big
  fields:
    - key: recipient
      label: სახელი
      placeholder: სრული სახელი
      required: true
      type: text
    - key: street
      label: ქუჩა
      placeholder: ქუჩის სახელი
      required: true
      type: text
    - key: houseNumber
      label: სახლის ნომერი
      placeholder: No
      required: true
      type: text
    - key: postcode
      label: საფოსტო ინდექსი
      placeholder: "0100"
      required: true
      type: text
    - key: city
      label: ქალაქი
      placeholder: თბილისი
      required: true
      type: text
    - key: region
      label: რეგიონი
      placeholder: აჭარა
      required: false
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{region}}
    Georgia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Street name
      required: true
      type: text
    - key: houseNumber
      label: House No
      placeholder: No
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "0100"
      required: true
      type: text
    - key: city
      label: City/Town
      placeholder: Tbilisi
      required: true
      type: text
    - key: region
      label: Region
      placeholder: Adjara
      required: false
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.gpost.ge/?group=3&letter=I&site-lang=en&site-path=help%2Fzipcodes%2F
  source: Georgian Post / NAPR Address Registry / Georgian NSDI
addressRules:
  languages:
    - code: ka
      name: Georgian
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - regionOrAutonomousRepublic
    - municipality
    - cityTownVillageOrSettlement
    - namedGeographicObjectOrStreet
    - houseOrBuildingNumber
    - registeredAddress
    - buildingOrStructure
    - entranceFloorOrUnit
  postalCode:
    label: 4 digits required; Georgian Post operator assignment is separate from derived postal geometry, resource-specific NAPR/NSDI licences, and building links and parcels remain separate
    required: true
    usage: required
  openSourceIds:
