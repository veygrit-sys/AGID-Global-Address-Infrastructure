    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
    - temporalValidityJurisdictionAndLanguage
  postalCode:
    label: 6 digits for postal delivery; office and delivery-network semantics are not guaranteed polygons
    required: true
    usage: The six-digit Uzbekistan postal index is positioned before the locality. The UPU 07/2019 sheet describes generic delivery-post-office or postal-hub, regional and provincial components and separate Tashkent post-office coding. A full index identifies delivery-network or post-office context and must not be presumed to be a polygon. A 2019 open-data row is dated and requires current validation. An UzPost search, post-office point, coordinate, administrative or cadastral area, property-register result, OSM feature, proximity surface or model does not independently prove an official postal polygon, public civic address, exact building relation, resident, ownership, deliverability, universal jurisdiction coverage or territorial scope. AGID is an independent spatial index linked only by versioned crosswalk.
