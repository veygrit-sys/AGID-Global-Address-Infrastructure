    - temporalValidityJurisdictionAndLanguage
  postalCode:
    label: 7-character alphanumeric real-estate-object code or transitional legacy 6-digit post-office index; neither is a guaranteed polygon
    required: true
    usage: Kazakhstan currently has two coexisting postcode systems. The UPU 07/2025 sheet and current assignment rules define seven alphanumeric characters before the locality; the first letter identifies a capital, region or city of republican significance, two digits identify an address block, and the remaining letter-digit pairs identify a real-estate object within that block. The legacy six-digit numeric code identifies post-office, district and regional context and is being phased out. A postcode, QazPost response, RKA, address-register result, NSDI or cadastral feature, office point, administrative area, public map, OSM feature, coordinate, proximity surface or model does not independently prove an official postal polygon, exact building footprint or unit, resident, ownership, deliverability, universal jurisdiction coverage or territorial scope. RKA is a separate 16-digit address-registration identifier. AGID is an independent spatial index linked only by a versioned crosswalk.
