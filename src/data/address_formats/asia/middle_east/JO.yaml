countryCode: JO
name: Jordan
native:
  name: الأردن
  addressFormat: |-
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{governorate}} {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: اسم المبنى
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: رقم البناء
      placeholder: "99"
      required: true
      type: text
    - key: street
      label: الشارع
      placeholder: شارع تجريبي
      required: true
      type: text
    - key: suburb
      label: المنطقة/الحي
      placeholder: منطقة تجريبية
      required: true
      type: text
    - key: governorate
      label: المحافظة
      placeholder: ""
      required: false
      type: text
    - key: city
      label: المدينة
      placeholder: مدينة تجريبية
      required: true
      type: text
    - key: poBox
      label: صندوق البريد
      placeholder: ""
      required: false
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: "99999"
      required: false
      type: text
    - key: civicAddressId
      label: معرّف العنوان المدني المصرح
      placeholder: ""
      required: false
      type: text
    - key: buildingId
      label: معرّف المبنى المرتبط صراحة
      placeholder: ""
      required: false
      type: text
english:
  addressFormat: |-
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{governorate}} {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building Name
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: Building No.
      placeholder: "99"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Synthetic Street
      required: true
      type: text
    - key: suburb
      label: Area/District
      placeholder: Synthetic District
      required: true
      type: text
    - key: governorate
      label: Governorate
      placeholder: ""
      required: false
      type: text
    - key: city
      label: City
      placeholder: Synthetic Locality
      required: true
      type: text
    - key: poBox
      label: P.O. Box
      placeholder: ""
      required: false
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "99999"
      required: false
      type: text
    - key: civicAddressId
      label: Rights-cleared Civic Address ID
      placeholder: ""
      required: false
      type: text
    - key: buildingId
      label: Explicitly Linked Building ID
      placeholder: ""
      required: false
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://jordanpost.com.jo/
  source: Jordan Post; UPU Jordan Addressing Sheet 2004; Jordan ICT and Postal Policy 2025; Jordan Open Data Portal; Royal Jordanian Geographic Centre
addressRules:
  languages:
    - code: ar
      name: Arabic
  nativeOrder:
    - postcode
    - governorate
    - city
    - street
    - building
    - name
  englishOrder:
    - postcode
    - governorate
    - city
    - street
    - building
    - name
  regionalHierarchy:
    - governorate
    - districtOrDirectorate
    - cityTownOrVillage
    - localityNeighbourhoodOrStreet
    - buildingPremiseApartmentOrPoBox
    - fiveDigitRoutingCode
    - postOfficeOrCarrierRouteObject
    - optionalDerivedAdministrativeJoinSurface
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
  postalCode:
    label: 5 digits when assigned
    required: false
    usage: routing/locality and post-office context; not guaranteed polygon or building address
openSourceIds:
  - jordanpost
  - upu-jordan-addressing-2004
  - modee-jordan-postal-policy-2025
  - trc-jordan-postal-sector
  - jordan-post-offices-open-data-2023
  - jordan-open-government-data-license-v1
  - rjgc-jordan
  - rjgc-jordan-eservices
  - rjgc-gam-building-mou
  - dls-jordan-village-codes-2022
  - gam-jordan-streets-2019
  - jordan-digital-mailbox-pilot-2026
  - osm-jordan
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - nasa-srtm
  - jaxa-aw3d30
  - gebco-bathymetry
  - gmrt-topography
  - hydrosheds
  - esa-worldcover
  - protected-planet-wdpa
  - gbif-occurrence
