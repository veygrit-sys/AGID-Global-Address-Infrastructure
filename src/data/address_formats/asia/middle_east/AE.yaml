countryCode: AE
name: United Arab Emirates
native:
  name: الإمارات العربية المتحدة
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}}, {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: المبنى/الشركة
      placeholder: برج خليفة
      required: false
      type: text
    - key: houseNumber
      label: رقم الفيلا/المبنى
      placeholder: "123"
      required: false
      type: text
    - key: street
      label: اسم الشارع
      placeholder: شارع الشيخ زايد
      required: true
      type: text
    - key: suburb
      label: المنطقة
      placeholder: وسط مدينة دبي
      required: false
      type: text
    - key: city
      label: المدينة
      placeholder: دبي
      required: true
      type: text
    - key: state
      label: الإمارة
      placeholder: دبي
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}}, {{state}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Burj Khalifa
      required: false
      type: text
    - key: houseNumber
      label: Villa/Building No.
      placeholder: "123"
      required: false
      type: text
    - key: street
      label: Street Name
      placeholder: Sheikh Zayed Road
      required: true
      type: text
    - key: suburb
      label: Area/Community
      placeholder: Downtown Dubai
      required: false
      type: text
    - key: city
      label: City
      placeholder: Dubai
      required: true
      type: text
    - key: state
      label: Emirate
      placeholder: Dubai
      required: true
      type: text
postalCode:
  format: Namespace-specific; Abu Dhabi Onwani postal codes are separate from PO Boxes and Makani entrance identifiers
  regex: null
  api: null
  source: Emirates Post PO Box service; Abu Dhabi DMT Onwani; Dubai Municipality Makani (reference metadata only)
addressRules:
  languages:
    - code: ar
      name: Arabic
    - code: en
      name: English
  nativeOrder:
