postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://post.iq/
  source: Iraq Post official domain and privacy policy 2025; UPU Iraq addressing sheet 03/2005; Iraqi Post and Ministry of Communications scheme announcement 2004; unverified ArcGIS zone-sector proposal 2025; NOGP, IGP and COSIT
addressRules:
  languages:
    - code: ar
      name: Arabic
    - code: ku
      name: Kurdish
    - code: en
      name: English
  nativeOrder: &a1
    - recipient
    - organization
    - houseNumber
    - street
    - quarter
    - alley
    - district
    - poBox
    - locality
    - governorate
    - postcode
    - country
  englishOrder: *a1
  regionalHierarchy:
    - officialFiveDigitPostalAssignment
    - postalOfficeDeliveryTypePoBoxOrBusinessHoldout
    - recipientOrOrganization
    - houseStreetQuarterAlley
    - districtLocalityGovernorate
    - officialPostalObjectGeometryWhenExactlyRightsCleared
    - unverifiedZoneSectorMigrationCandidate
    - iraqGeographicPortalAdministrativeCandidate
    - statisticsGisAdministrativeContextIndependentFromPostcode
    - optionalDerivedPostalContextSurface
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
    - territorialScopeExplicitAndVersioned
  postalCode:
    label: 5 digits required for postal addressing
    required: true
    usage: The five-digit postcode is an opaque Iraq Post assignment with documented region, governorate, delivery-type and post-office semantics. It may identify a post office, P.O. Box, business holdout, delivery object, point or other non-area object, so a polygon is never presumed. The 2025 ArcGIS zone-plus-sector model has an unverified owner and no item licence and remains a migration candidate, not a current assignment or parser format. UPU examples, the historical announcement, app address or location input, NOGP, IGP, COSIT, administrative boundaries, OSM, proximity or models do not independently prove a current postcode, reusable postal polygon, exact civic-address relation, building relation, delivery entitlement or territorial scope.
  openSourceIds:
    - iraq-post
    - iraq-post-platform
    - iraq-post-privacy-2025
    - upu-iraq-addressing-2005
    - iraq-post-2004-code-announcement
    - iraq-post-new-code-storymap-2025
    - iraq-open-government-portal
    - iraq-open-government-data-policy
    - iraq-geographic-portal
    - iraq-statistics-gis
    - osm-iraq
    - osm-nominatim
    - osm-overpass
