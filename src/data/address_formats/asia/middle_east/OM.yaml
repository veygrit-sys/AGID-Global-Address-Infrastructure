countryCode: OM
name: Oman
native:
  name: عُمان
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{unit}}
    {{postcode}}
    {{city}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: اسم المؤسسة/المبنى
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: رقم المبنى
      placeholder: "70"
      required: false
      type: text
    - key: street
      label: رقم الطريق/اسم الشارع
      placeholder: طريق 3430
      required: false
      type: text
    - key: suburb
      label: المنطقة/الحي
      placeholder: الخوير
      required: false
      type: text
    - key: unit
      label: صندوق البريد (خاص)
      placeholder: ص.ب 15
      required: false
      type: text
    - key: postcode
      label: الرمز البريدي لمكتب البريد
      placeholder: "133"
      required: true
      type: text
    - key: city
      label: المحلية/الولاية
      placeholder: الخوير
      required: true
      type: text
    - key: state
      label: المحافظة
      placeholder: مسقط
      required: false
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{unit}}
    {{postcode}}
    {{city}}
    {{state}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization / Building
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: Building No.
      placeholder: "70"
      required: false
      type: text
    - key: street
      label: Way No. / Street
      placeholder: Way 3430
      required: false
      type: text
    - key: suburb
      label: Area / District
      placeholder: Al Khuwair
      required: false
      type: text
    - key: unit
      label: P.O. Box (private)
      placeholder: P.O. Box 15
      required: false
      type: text
    - key: postcode
      label: Post-office Code
      placeholder: "133"
      required: true
      type: text
    - key: city
      label: Locality / Wilayat
      placeholder: Al Khuwair
      required: true
      type: text
    - key: state
      label: Governorate
      placeholder: Muscat
      required: false
      type: text
postalCode:
  format: NNN
  regex: ^\d{3}$
  api: https://www.omanpost.om/index.php/office-locator
  source: UPU Oman Postal Addressing System / Oman Post office locator and website terms / NCSI wilayat context and open-data policy / NSGIA geospatial governance
addressRules:
  languages:
    - code: ar
      name: Arabic
  nativeOrder:
    - postcode
    - postOffice
    - governorate
    - wilayat
    - locality
    - poBox
    - building
    - way
    - name
  englishOrder:
    - postcode
    - postOffice
    - governorate
    - wilayat
    - locality
    - poBox
    - building
    - way
    - name
  regionalHierarchy:
    - governorate
    - wilayat
    - locality
    - threeDigitPostOfficeRoutingCode
    - postOfficePointOrNoCanonicalGeometry
    - poBoxNumberWhenProvided
    - buildingNumber
    - wayNumberOrStreet
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
  postalCode:
    label: 3 digits identify an Oman Post office/region routing code; an office point is not a postal polygon. Keep P.O. box, physical building, explicit building relation, private recipient and subscriber evidence separate.
    required: true
    usage: required
  openSourceIds:
    - upu-oman-postal-addressing
    - oman-post-office-locator
    - oman-post-website-terms
    - gov-oman-building-addressing-service
    - ncsi-oman-wilayat-boundaries
    - ncsi-oman-open-government-data-policy
    - nsgia-oman-geospatial-governance
    - nsgia-oman-portal-terms
    - nsgia-oman
    - oman-post
    - osm-oman
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
