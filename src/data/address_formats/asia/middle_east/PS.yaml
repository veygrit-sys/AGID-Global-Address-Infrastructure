countryCode: PS
name: Palestine
native:
  name: فلسطين
  addressFormat: |-
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: اسم المبنى
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: رقم المنزل
      placeholder: "1"
      required: false
      type: text
    - key: street
      label: الشارع
      placeholder: شارع الإرسال
      required: true
      type: text
    - key: suburb
      label: الحي
      placeholder: حي الطيرة
      required: true
      type: text
    - key: city
      label: المدينة
      placeholder: رام الله
      required: true
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: P600
      required: false
      type: text
english:
  addressFormat: |-
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}} {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building Name
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Al-Irsal St
      required: true
      type: text
    - key: suburb
      label: Area/District
      placeholder: Al-Tira
      required: true
      type: text
    - key: city
      label: City
      placeholder: Ramallah
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: P600
      required: false
      type: text
postalCode:
  format: PNNN (P3 area) or PNNNNNNN (P7 delivery point)
  regex: ^P(?:[0-9]{3}|[0-9]{7})$
  api: https://postcode.palestine.ps/
  source: Palestine Post / MTDE; UPU addressing sheet 05/2025
addressRules:
  languages:
    - code: ar
      name: Arabic
  nativeOrder:
    - city
    - area
    - street
    - name
  englishOrder:
    - city
    - area
    - street
    - name
  regionalHierarchy:
    - city
    - area
  postalCode:
    label: P3 postal area or P7 delivery point when officially assigned
    required: false
    usage: P3 is an area code; P7 adds a final-delivery-point identifier. A valid format is not a verified assignment. P7 suffixes are not house numbers. Postal polygons, code prefixes, locality names and proximity do not establish an exact address or building; independently permitted source records and explicit relations are required. AGID is an independent spatial index. Official, derived, virtual and missing geometry remain distinct.
openSourceIds:
  - palestine-open-data-postcodes
  - palestine-post
  - osm-palestine
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - nasa-srtm
  - jaxa-aw3d30
  - gebco-bathymetry
  - gmrt-topography
  - hydrosheds
  - esa-worldcover
  - protected-planet-wdpa
  - gbif-occurrence
