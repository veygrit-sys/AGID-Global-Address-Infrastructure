    - locality
    - subLocality
    - street
    - subStreet
    - houseNumber
    - floor
    - unit
    - building
    - postOffice
    - poBox
    - posteRestante
  evidenceLayers:
    - officialTenDigitPlaceIdentifier
    - officialForwardingPrefixSemantics
    - officialPostalObjectType
    - operatorGnafStandardAddress
    - operatorGnafAddressPoint
    - operatorGnafBuildingOrParcelGeometryUnderSeparateRights
    - poBoxWithoutPostcode
    - posteRestanteWithoutPostcode
    - administrativeContext
    - optionalDerivedPostalContextSurface
    - explicitRightsClearedCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
    - temporalValidityAndJurisdiction
  postalCode:
    label: 10 digits for regular delivery; omitted for P.O. Box and poste restante
    required: false
    usage: The ten-digit Iran Post code is a place identifier with documented zone, segment, part, district, forwarding-code and identification-code components. It is used for regular urban and rural delivery, while the UPU 10/2023 sheet states that P.O. Box and poste restante addresses do not use it. A full code may resolve to a delivery location or address object and must not be presumed to be a polygon. A five-digit forwarding prefix, GNAF search result, certificate, coordinate, NSDI or administrative layer, independent open-data map, OSM feature, proximity surface or model does not independently prove an official postal polygon, public civic address, exact building relation, occupant, ownership, deliverability or territorial scope.
  openSourceIds: &a1
    - iran-post
    - iran-post-gnaf
    - gavahi-post-ir
    - upu-iran-addressing-2023
    - iran-nsdi
    - iran-open-data
    - osm-iran
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
