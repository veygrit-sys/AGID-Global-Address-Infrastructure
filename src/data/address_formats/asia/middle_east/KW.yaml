countryCode: KW
name: Kuwait
native:
  name: الكويت
  addressFormat: |-
    {{organization}}
    الرقم الآلي {{buildingId}}
    مبنى {{houseNumber}}، شارع {{street}}، قطعة {{suburb}}
    {{city}}، {{state}}
    {{postcode}} الكويت
  ordering: small-to-big
  fields:
    - key: organization
      label: اسم المبنى
      placeholder: برج الحمراء
      required: false
      type: text
    - key: buildingId
      label: الرقم الآلي للعنوان (PACI)
      placeholder: "00000000"
      required: false
      type: text
    - key: houseNumber
      label: رقم المنزل/المبنى
      placeholder: "1"
      required: true
      type: text
    - key: street
      label: الشارع
      placeholder: شارع الخليج العربي
      required: true
      type: text
    - key: suburb
      label: القطعة
      placeholder: قطعة 1
      required: true
      type: text
    - key: city
      label: المنطقة/المدينة
      placeholder: مدينة الكويت
      required: true
      type: text
    - key: state
      label: المحافظة
      placeholder: محافظة العاصمة
      required: true
      type: text
    - key: postcode
      label: الرمز البريدي
      placeholder: "00000"
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    PACI No. {{buildingId}}
    Building {{houseNumber}}, Street {{street}}, Block {{suburb}}
    {{city}}, {{state}}
    {{postcode}} KUWAIT
  ordering: small-to-big
  fields:
    - key: organization
      label: Building Name
      placeholder: Al Hamra Tower
      required: false
      type: text
    - key: buildingId
      label: PACI Automated Address No.
      placeholder: "00000000"
      required: false
      type: text
    - key: houseNumber
      label: House/Building No.
      placeholder: "1"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Arabian Gulf St
      required: true
      type: text
    - key: suburb
      label: Block
      placeholder: Block 1
      required: true
      type: text
    - key: city
      label: Area/City
      placeholder: Kuwait City
      required: true
      type: text
    - key: state
      label: Governorate
      placeholder: Capital Governorate
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "00000"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.moc.gov.kw/en/important-links?tab=2
  source: Kuwait Ministry of Communications postal-code tables / UPU Kuwait addressing / PACI address and building services / Kuwait Municipality GIS / CSB census GIS
addressRules:
  languages:
    - code: ar
      name: Arabic
  nativeOrder:
    - postcode
    - governorate
    - area
    - block
    - street
    - building
    - paciAutomatedAddressNumber
    - name
  englishOrder:
    - postcode
    - governorate
    - area
    - block
    - street
    - building
    - paciAutomatedAddressNumber
    - name
  regionalHierarchy:
    - governorate
    - areaOrDistrict
    - block
    - streetOrLane
    - buildingNumber
    - paciAutomatedAddressNumber
    - currentFiveDigitPostcode
    - blockOrPoBoxAssignmentClass
    - officialPostalSurfaceOrNoCanonicalGeometry
    - optionalDerivedBlockSurface
    - explicitPaciAddressPoint
    - explicitAddressLinkedBuildingOrParcel
    - exactRightsClearedBuildingGeometry
  postalCode:
    label: current 5 digits; MOC block assignments and P.O. box ranges stay distinct; governorate/area/block/street/building and PACI automated address evidence remain typed; derived block surfaces are non-canonical; exact buildings require an explicit rights-cleared relation
    required: true
    usage: required
  normalizationPriority:
    - pinned Kuwait Ministry of Communications block or P.O. box-range assignment
    - UPU five-digit and address-order semantics
    - explicit PACI governorate area block street building and automated-number relation
    - rights-cleared PACI or Municipality geometry with exact edition CRS and digest
    - CSB administrative and statistical context with explicit crosswalk
    - OSM only for source-qualified discrepancy validation
openSourceIds:
  - kuwait-post
  - upu-kuwait-addressing
  - paci-kuwait-finder
  - paci-kuwait-address-services
  - paci-kuwait-building-register
  - kuwait-municipality-parcels
  - kuwait-csb-census-gis
  - osm-kuwait
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - nasa-srtm
  - jaxa-aw3d30
  - gebco-bathymetry
  - gmrt-topography
  - hydrosheds
  - esa-worldcover
  - protected-planet-wdpa
  - gbif-occurrence
