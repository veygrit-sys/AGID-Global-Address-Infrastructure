countryCode: ID
name: Indonesia
native:
  name: Indonesia
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{subdistrict}}, {{district}}
    {{city}} {{state}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Nama Gedung/Perusahaan
      placeholder: Monas
      required: false
      type: text
    - key: houseNumber
      label: No. Rumah/Blok
      placeholder: No. 1
      required: false
      type: text
    - key: street
      label: Nama Jalan
      placeholder: Jl. Medan Merdeka Utara
      required: true
      type: text
    - key: subdistrict
      label: Kelurahan/Desa
      placeholder: Gambir
      required: true
      type: text
    - key: district
      label: Kecamatan
      placeholder: Gambir
      required: true
      type: text
    - key: city
      label: Kota/Kabupaten
      placeholder: Jakarta Pusat
      required: true
      type: text
    - key: state
      label: Provinsi
      placeholder: DKI Jakarta
      required: true
      type: text
    - key: postcode
      label: Kode Pos
      placeholder: "10110"
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{subdistrict}}, {{district}}
    {{city}}, {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Monas
      required: false
      type: text
    - key: houseNumber
      label: House/Block No.
      placeholder: No. 1
      required: false
      type: text
    - key: street
      label: Street Name
      placeholder: Jl. Medan Merdeka Utara
      required: true
      type: text
    - key: subdistrict
      label: Kelurahan
      placeholder: Gambir
      required: true
      type: text
    - key: district
      label: Kecamatan
      placeholder: Gambir
      required: true
      type: text
    - key: city
      label: City/Regency
      placeholder: Central Jakarta
      required: true
      type: text
    - key: state
      label: Province
      placeholder: Jakarta
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "10110"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^[1-9]\d{4}$
  api: https://kodepos.posindonesia.co.id/
  source: Indonesia Postal Law 38/2009 / Ministerial Regulation 8/2025 / Pos Indonesia Kodepos / UPU addressing / Satu Data crosswalk / Kemendagri / BPS / BIG
addressRules:
  languages:
    - code: id
      name: Indonesian
  nativeOrder:
    - postcode
    - province
    - cityOrRegency
    - district
    - street
    - houseNumber
    - name
  englishOrder:
    - postcode
    - province
    - cityOrRegency
    - district
    - street
    - houseNumber
    - name
  regionalHierarchy:
    - province
    - cityOrRegency
    - districtOrKecamatan
    - villageOrUrbanVillage
    - rtRwNeighbourhoodContext
    - currentFiveDigitPostcode
    - officialPostalSurfaceOrNoCanonicalGeometry
    - optionalDerivedLocalitySurface
    - explicitCivicAddressPoint
    - explicitAddressLinkedBuildingFeature
    - exactRightsClearedBuilding
  postalCode:
    label: current 5 digits beginning 1–9; future legal schemes may use letters; preserve province/city-regency/district/village and RT/RW evidence; administrative joins remain derived unless an exact official surface exists; exact building requires an explicit address link
    required: true
    usage: required
  normalizationPriority:
    - pinned Pos Indonesia current postcode and locality result or licensed assignment edition
    - versioned ministerial numeric alphabetic or combined code scheme
    - explicit Kemendagri BPS Pos Indonesia and BIG identifier crosswalks
    - exact rights-cleared BIG administrative geometry as nonpostal context
    - rights-cleared civic-address point and explicit building relation
    - Satu Data and OSM only for source-qualified crosswalk or discrepancy validation
  openSourceIds:
    - indonesia-post-law-2009
    - indonesia-post-regulation-2025
    - pos-indonesia
    - upu-indonesia-addressing
    - sdi-indonesia-village-postcode
    - kemendagri-indonesia-admin-codes
    - bps-indonesia-statistical-area-codes
    - big-indonesia-village-boundaries
    - big-indonesia-rbi-buildings
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
