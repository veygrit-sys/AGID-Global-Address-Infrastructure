    - country
  regionalHierarchy:
    - province
    - district
    - commune
    - village
  postalCode:
    label: MPTC Prakas No. 77 six-digit postal code
    required: true
    usage: Current six-digit typed assignments are PP0000 for province/capital, PPDD00 for municipality/district/khan, and PPDDCC for commune/sangkat. Prefix similarity, NCDD administrative code or boundary, ODC row, UPU example, postcode lookup, coordinate, API/model result, OSM feature, parcel, or proximity does not itself create official postal geometry or an exact building relation. Keep legacy assignments, administrative identifiers, villages, civic addresses, cadastral parcels, buildings and AGID as separately versioned objects. Building display requires an explicit rights-cleared civic identity, a reviewed stable address-to-building relation, separately permitted geometry, validity and privacy approval.
