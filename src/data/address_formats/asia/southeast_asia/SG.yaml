countryCode: SG
name: Singapore
native:
  name: English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    SINGAPORE {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building
      placeholder: Marina Bay Sands
    - key: houseNumber
      label: Block/House No.
      placeholder: "10"
    - key: street
      label: Street Name
      placeholder: Bayfront Ave
    - key: subdistrict
      label: Unit No.
      placeholder: "#01-01"
    - key: postcode
      label: Postal Code
      placeholder: "018956"
      required: true
domestic:
  ms:
    name: Bahasa Melayu
    addressFormat: |-
      {{organization}}
      {{houseNumber}} {{street}}
      {{subdistrict}}
      SINGAPURA {{postcode}}
    ordering: small-to-big
    fields:
      - key: organization
        label: Bangunan
        placeholder: Marina Bay Sands
      - key: houseNumber
        label: No. Blok/Rumah
        placeholder: "10"
      - key: street
        label: Nama Jalan
        placeholder: Bayfront Ave
      - key: subdistrict
        label: No. Unit
        placeholder: "#01-01"
      - key: postcode
        label: Poskod
        placeholder: "018956"
        required: true
  zh:
    name: 简体中文
    addressFormat: |-
      新加坡 {{postcode}}
      {{subdistrict}}
      {{street}} {{houseNumber}}
      {{organization}}
    ordering: big-to-small
    fields:
      - key: organization
        label: 大厦/公司
        placeholder: 滨海湾金沙
      - key: houseNumber
        label: 门牌/楼层
        placeholder: "10"
      - key: street
        label: 街道名称
        placeholder: 海湾道
      - key: subdistrict
        label: 单元号
        placeholder: "#01-01"
      - key: postcode
        label: 邮政编码
        placeholder: "018956"
        required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    SINGAPORE {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Marina Bay Sands
    - key: houseNumber
      label: Block/House No.
      placeholder: "10"
    - key: street
      label: Street Name
      placeholder: Bayfront Ave
    - key: subdistrict
      label: Unit/Level Info
      placeholder: "#01-01"
    - key: postcode
      label: Postal Code
      placeholder: "018956"
      required: true
postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: https://www.onemap.gov.sg/api/common/elastic/search?searchVal={{postcode}}&returnGeom=Y&getAddrDetails=Y&pageNum=1
  source: Singapore Land Authority / OneMap
addressRules:
  languages:
    - code: en
      name: English
    - code: ms
      name: Malay
    - code: zh
      name: Chinese
  nativeOrder:
    - name
    - building
    - street
    - unit
    - postcode
  englishOrder:
    - postcode
    - street
    - building
    - unit
    - name
  regionalHierarchy:
    - cityState
  postalCode:
    label: 6 digits required
    required: true
    usage: required
  openSourceIds:
    - onemap-sg
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
openSourceIds:
  - onemap-sg
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - nasa-srtm
  - jaxa-aw3d30
  - gebco-bathymetry
  - gmrt-topography
  - hydrosheds
  - esa-worldcover
  - protected-planet-wdpa
  - gbif-occurrence
