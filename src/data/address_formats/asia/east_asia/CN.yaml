countryCode: CN
name: China
native:
  name: 中国
  addressFormat: |-
    {{postcode}}
    {{province}}{{prefectureCity}}{{districtOrCounty}}{{township}}{{villageOrCommunity}}
    {{street}}{{houseNumber}}{{compound}}{{building}}{{unit}}{{floor}}{{room}}
    {{organization}}
    {{recipient}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: 邮政编码
      placeholder: "999999"
      required: true
      type: text
    - key: province
      label: 省/自治区/直辖市
      placeholder: 示例省
      required: true
      type: text
    - key: prefectureCity
      label: 地级市/自治州
      placeholder: 示例市
      required: false
      type: text
    - key: districtOrCounty
      label: 区/县/旗
      placeholder: 示例区
      required: true
      type: text
    - key: township
      label: 街道/乡/镇
      placeholder: 示例街道
      required: false
      type: text
    - key: villageOrCommunity
      label: 村/社区/小区
      placeholder: 示例社区
      required: false
      type: text
    - key: street
      label: 路/街/巷
      placeholder: 示例路
      required: false
      type: text
    - key: houseNumber
      label: 门牌号
      placeholder: 99号
      required: false
      type: text
    - key: compound
      label: 住宅区/院/园区
      placeholder: 示例小区
      required: false
      type: text
    - key: building
      label: 楼栋
      placeholder: 99号楼
      required: false
      type: text
    - key: unit
      label: 单元
      placeholder: 99单元
      required: false
      type: text
    - key: floor
      label: 楼层
      placeholder: 99层
      required: false
      type: text
    - key: room
      label: 室
      placeholder: 999室
      required: false
      type: text
    - key: organization
      label: 单位/机构
      placeholder: 示例机构
      required: false
      type: text
    - key: recipient
      label: 收件人
      placeholder: 合成收件人
      required: false
      type: text
    - key: postOffice
      label: 邮政局所/局留
      placeholder: 合成邮政局所
      required: false
      type: text
    - key: poBox
      label: 邮政信箱
      placeholder: 合成信箱99
      required: false
      type: text
