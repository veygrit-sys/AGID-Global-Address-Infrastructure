    {{organization}}
    {{room}}, {{floor}}, {{unit}}, {{building}}, {{compound}}
    {{houseNumber}} {{street}}, {{villageOrCommunity}}, {{township}}
    {{districtOrCounty}}, {{prefectureCity}}
    {{postcode}} {{province}}
    P.R. CHINA
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Synthetic Recipient
      required: false
    - key: organization
      label: Organization
      placeholder: Synthetic Organization
      required: false
    - key: room
      label: Room
      placeholder: Room 999
      required: false
    - key: floor
      label: Floor
      placeholder: Floor 99
      required: false
    - key: unit
      label: Unit
      placeholder: Unit 99
      required: false
    - key: building
      label: Building
      placeholder: Building 99
      required: false
    - key: compound
      label: Residential area / compound
      placeholder: Synthetic Compound
      required: false
    - key: houseNumber
      label: Premises number
      placeholder: No. 99
      required: false
    - key: street
      label: Street / road (Pinyin)
      placeholder: Synthetic Lu
      required: false
    - key: villageOrCommunity
      label: Village / community
      placeholder: Synthetic Cun
      required: false
    - key: township
      label: Township / subdistrict
      placeholder: Synthetic Zhen
      required: false
    - key: districtOrCounty
      label: District / county
      placeholder: Synthetic Xian
      required: false
    - key: prefectureCity
      label: Prefecture-level city
      placeholder: Synthetic Shi
      required: false
    - key: province
      label: Province / autonomous region / municipality
      placeholder: Synthetic Province
      required: false
    - key: postcode
      label: Postcode
      placeholder: "999999"
      required: true
    - key: postOffice
      label: Post office / poste restante
      placeholder: Synthetic Post Office
      required: false
    - key: poBox
      label: P.O. Box
      placeholder: Synthetic Box 99
      required: false
postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: https://www.chinapost.com.cn/
  source: China Post and postal-code authority rules; UPU China addressing sheet 09/2013; State Post Bureau 2025 response; GB/T 41832-2022; GB/T 39609-2020; Geographical Names Regulation; Tianditu; real-estate query rules; OpenStreetMap
addressRules:
  languages:
    - code: zh-Hans
      name: Chinese (Simplified)
    - code: en
      name: English display or Hanyu Pinyin transliteration
  nativeOrder:
    - postcode
    - province
    - prefectureCity
    - districtOrCounty
    - township
    - villageOrCommunity
    - street
    - houseNumber
    - compound
    - building
    - unit
    - floor
    - room
    - organization
    - recipient
    - postOffice
    - poBox
    - country
  englishOrder:
    - recipient
    - organization
    - room
    - floor
    - unit
    - building
    - compound
    - houseNumber
    - street
    - villageOrCommunity
    - township
    - districtOrCounty
    - prefectureCity
    - postcode
    - province
    - postOffice
    - poBox
    - country
  regionalHierarchy:
    - provinceOrAutonomousRegionOrMunicipality
    - prefectureCityOrAutonomousPrefecture
    - districtCountyOrBanner
    - townshipTownOrSubdistrict
    - villageCommunityOrCompound
    - street
    - houseNumber
    - building
    - unitFloorAndRoom
    - sixDigitPostalRoutingCode
    - universalDeliveryAddressCode
    - standardAddressOrDoorplateId
    - buildingOrParcelId
    - explicitRightsClearedBuilding
  evidenceLayers:
    - officialSixDigitPostalAssignment
    - postalRoutingRegionAndValidity
    - universalDeliveryAddressCodeSeparateSystem
    - standardGeographicalNameAndAddress
    - officialSpatialDatasetUnderExactTerms
    - optionalDerivedPostalContextSurface
    - explicitDoorplateOrCivicAddress
    - explicitAddressLinkedBuilding
    - exactRightsClearedBuildingGeometry
    - agidIndependentSpatialIndex
    - temporalValidityJurisdictionScriptAndTerritorialScope
  postalCode:
    label: 6-digit China Post routing code; delivery-region semantics do not guarantee a polygon or building
    required: true
    usage: China has used a four-level six-digit postcode system since 1986. The code supports delivery-region routing and sorting, but a code, prefix, destination county, office, coordinate, administrative polygon, Tianditu result, geocode, OSM feature, proximity surface or model does not independently prove an official postal polygon, exact civic address, building, unit, recipient, deliverability or universal coverage. GB/T 41832-2022 universal delivery address codes are a separate high-precision addressing system and must not be parsed as six-digit postcodes or AGID cells. Building-level display requires an explicit rights-cleared standard address or doorplate identity, a reviewed relation to a stable building identifier, and separately permitted point or footprint geometry. AGID is an independent spatial index connected only through a versioned crosswalk. CN, HK, MO and TW data packs remain technically separate and imply no sovereignty determination.
  openSourceIds:
