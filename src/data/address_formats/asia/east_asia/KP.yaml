countryCode: KP
name: North Korea
native:
  name: 조선민주주의인민공화국
  addressFormat: |-
    {{postcode}}
    {{state}} {{city}} {{district}}
    {{street}} {{houseNumber}}
    {{organization}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: 우편번호
      placeholder: ""
      required: false
      type: text
    - key: state
      label: 도/직할시
      placeholder: 평양시
      required: true
      type: text
    - key: city
      label: 시/군/구
      placeholder: 중구역
      required: true
      type: text
    - key: district
      label: 동/리
      placeholder: 창전동
      required: false
      type: text
    - key: street
      label: 도로명/번지
      placeholder: 승리거리
      required: false
      type: text
    - key: houseNumber
      label: 건물번호
      placeholder: "1"
      required: false
      type: text
    - key: organization
      label: 상세주소
      placeholder: 101호
      required: false
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{district}}, {{city}}
    {{state}} {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Detail
      placeholder: Room 101
      required: false
      type: text
    - key: houseNumber
      label: No.
      placeholder: "1"
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Sungri St
      required: false
      type: text
    - key: district
      label: Neighborhood/Village
      placeholder: Changjon-dong
      required: false
      type: text
    - key: city
      label: City/County/District
      placeholder: Jung-guyok
      required: true
      type: text
    - key: state
      label: Province/City
      placeholder: Pyongyang
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: ""
      required: false
      type: text
postalCode:
  format: null
  regex: null
  api: null
  source: UPU General Addressing Issues, KP not-required table (Sep. 2025); https://www.upu.int/UPU/media/upu/documents/PostCode/General-Addressing-Issues.pdf
addressRules:
  languages:
    - code: ko-KP
      name: Korean (North Korean standard)
  nativeOrder:
    - province
    - cityOrCounty
    - district
    - neighborhood
    - lot
    - name
  englishOrder:
    - province
    - city
    - district
    - neighborhood
    - lot
    - name
  regionalHierarchy:
    - province
    - cityOrCounty
    - district
  postalCode:
    label: Postal code not required in UPU reference (Sep. 2025); official format not verified
    required: false
    usage: optional
  openSourceIds:
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
