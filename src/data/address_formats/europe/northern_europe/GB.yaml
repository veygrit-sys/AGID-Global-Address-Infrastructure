countryCode: GB
name: United Kingdom
native:
  name: English (UK)
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company
      placeholder: ""
    - key: houseNumber
      label: Building Name/No.
      placeholder: "10"
    - key: street
      label: Street
      placeholder: Downing St
    - key: suburb
      label: Locality
      placeholder: Westminster
    - key: city
      label: Town/City
      placeholder: London
    - key: postcode
      label: Postcode
      placeholder: SW1A 2AA
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
    UNITED KINGDOM
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: houseNumber
      label: No./Bldg
      placeholder: "10"
    - key: street
      label: St./Rd./Sq. (Latin)
      placeholder: Downing St
    - key: suburb
      label: Locality
      placeholder: Westminster
    - key: city
      label: Town/City
      placeholder: London
    - key: postcode
      label: Postcode
      placeholder: SW1A 2AA
      required: true
postalCode:
  format: AN NAA, ANA NAA, ANN NAA, AAN NAA, AANA NAA, AANN NAA
  regex: ^([A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2})$
  api: https://postcodes.io/
  source: ONS postcode products derived from Royal Mail and OS data; postcodes.io API
addressRules:
  languages:
    - code: en
      name: English
  nativeOrder:
    - recipient
    - street
    - locality
    - postTown
    - postcode
    - country
  englishOrder:
    - recipient
    - street
    - locality
    - postTown
    - postcode
    - country
  regionalHierarchy:
    - countyOrCity
  postalCode:
    label: UK outward/inward postcode required
    required: true
    usage: required
  openSourceIds:
    - postcodes-io
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - ons-postcode-directory
    - ordnance-survey-open-names
    - ordnance-survey-boundary-line
    - ordnance-survey-open-uprn
    - ordnance-survey-openmap-local
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
