countryCode: LV
name: Latvia
native:
  name: Latvija
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{city}}, {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Uzņēmums/Organizācija
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Iela
      placeholder: Brīvības iela
      required: true
      type: text
    - key: houseNumber
      label: Mājas/Dzīvokļa nr.
      placeholder: 1-1
      required: true
      type: text
    - key: city
      label: Pilsēta/Novads
      placeholder: Rīga
      required: true
      type: text
    - key: postcode
      label: Pasta indekss
      placeholder: LV-1001
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{city}}, {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Brivibas St
      required: true
      type: text
    - key: houseNumber
      label: House/Apt No.
      placeholder: 1-1
      required: true
      type: text
    - key: city
      label: City
      placeholder: Riga
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: LV-1001
      required: true
      type: text
postalCode:
  format: LV-NNNN
  regex: ^LV-\d{4}$
  api: https://pasts.lv/en/services/tariffs-and-information/postcode-book
  source: Latvijas Pasts assignment with VZD Address Register and Cadastre evidence
addressRules:
  languages:
    - code: lv
      name: Latvian
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - municipality
    - cityOrVillage
    - street
    - premise
  postalCode:
    label: LV-NNNN; address membership and special organization codes may be non-areal
    required: true
    usage: required
  openSourceIds:
    - latvijas-pasts-check-address
    - vzd-latvia-cadastral-buildings
    - vzd-latvia-administrative-boundaries
    - kartes-lv-postal-codes
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - lgia-latvia
    - vzd-latvia-address-register
    - data-gov-lv-geodata
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
