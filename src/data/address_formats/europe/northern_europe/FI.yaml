countryCode: FI
name: Finland
native:
  name: Suomi
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Yritys/Organisaatio
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Katu
      placeholder: Mannerheimintie
      required: true
      type: text
    - key: houseNumber
      label: Talon numero
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postinumero
      placeholder: "00100"
      required: true
      type: text
    - key: city
      label: Postitoimipaikka
      placeholder: Helsinki
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Mannerheimintie
      required: true
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "00100"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Helsinki
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.posti.fi/en/for-businesses/customer-support/postal-code-services
  source: Posti Postal Code Services with Statistics Finland Paavo, DVV BDR, SYKE Ryhti, and NLS address/building evidence
addressRules:
  languages:
    - code: fi
      name: Finnish
    - code: sv
      name: Swedish
  nativeOrder:
    - name
    - street
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - postcode
    - city
    - country
  regionalHierarchy:
    - region
    - subRegion
    - municipality
    - postalAssignmentOrSpecialEndpoint
    - streetName
    - houseNumberAndRange
    - addressPointOrInterpolatedRoadLocation
    - stairwayAndApartment
    - permanentBuildingIdentifier
    - explicitRyhtiOrSourceLinkedBuilding
  postalCode:
    label: 5 digits; Posti assignment, Paavo statistical area, address, apartment, building, and FI/AX scope remain separate
    required: true
    usage: required
  openSourceIds:
    - posti-finland-basic-address-file
    - statistics-finland-paavo-postal-areas
    - dvv-finland-building-dwelling-register
    - syke-finland-ryhti-building-addresses
    - nls-finland-topographic-road-addresses
    - nls-finland-topographic-buildings
    - nls-finland-municipal-division
    - aland-post-postal-services
    - posti-finland-postal-code-services
    - avoindata-fi-postcodes
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nls-finland
    - maanmittauslaitos-open-data
    - dvv-finland-address-data
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
