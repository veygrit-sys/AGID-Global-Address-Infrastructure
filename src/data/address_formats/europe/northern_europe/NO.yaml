countryCode: NO
name: Norway
native:
  name: Norge
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    Norge
  ordering: small-to-big
  fields:
    - key: recipient
      label: Navn
      placeholder: Fullt navn
      required: true
      type: text
    - key: street
      label: Gate
      placeholder: Karl Johans gate
      required: true
      type: text
    - key: houseNumber
      label: Husnummer
      placeholder: Nr
      required: true
      type: text
    - key: postcode
      label: Postnummer
      placeholder: "0150"
      required: true
      type: text
    - key: city
      label: Poststed
      placeholder: Oslo
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    Norway
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Street name
      required: true
      type: text
    - key: houseNumber
      label: House No
      placeholder: No
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "0150"
      required: true
      type: text
    - key: city
      label: City/Town
      placeholder: Oslo
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.bring.no/en/services/address-verification-services/postcodes
  source: Posten Bring postcode register with Kartverket Postnummerområder, Matrikkelen address/unit/building-point, and licensed FKB building evidence
addressRules:
  languages:
    - code: no
      name: Norwegian
  nativeOrder:
    - name
    - street
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - postcode
    - city
    - country
  regionalHierarchy:
    - county
    - municipality
    - postalAreaOrNonArea
    - postalPlace
    - streetOrPlaceName
    - houseNumberAndLetter
    - addressId
    - dwellingUnitNumberAndId
    - buildingNumberAndPoint
    - explicitLicensedFkbBuilding
  postalCode:
    label: 4 digits; G/P/B/S category, official area or non-area, address, unit, building, and NO/SJ scope remain separate
    required: true
    usage: required
  openSourceIds:
    - data-norge
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - kartverket-norway
    - geonorge-norway
    - posten-bring-norway-postcode-register
    - kartverket-norway-postcode-areas
    - kartverket-norway-address-api
    - kartverket-norway-matrikkelen-address
    - kartverket-norway-matrikkelen-address-unit
    - kartverket-norway-matrikkelen-building-points
    - geovekst-norway-fkb-buildings
