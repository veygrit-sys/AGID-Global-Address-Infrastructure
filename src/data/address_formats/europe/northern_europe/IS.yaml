countryCode: IS
name: Iceland
native:
  name: Ísland
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Fyrirtæki/Stofnun
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Gata
      placeholder: Laugavegur
      required: true
      type: text
    - key: houseNumber
      label: Húsnúmer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Póstnúmer
      placeholder: "101"
      required: true
      type: text
    - key: city
      label: Sveitarfélag/Bær
      placeholder: Reykjavík
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Laugavegur
      required: true
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "101"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Reykjavik
      required: true
      type: text
postalCode:
  format: NNN
  regex: ^\d{3}$
  api: https://posturinn.is/einstaklingar/ymsar-upplysingar/verdskra/svaedaskipting-postnumera/
  source: Pósturinn routing reference; HMS Staðfangaskrá addresses; Náttúrufræðistofnun IS 50V postcode and building geometry
addressRules:
  languages:
    - code: is
      name: Icelandic
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - city
  postalCode:
    label: 3 digits required
    required: true
    usage: required
  openSourceIds:
    - posturinn-iceland-postcodes
    - natt-is50v-postcode-boundaries
    - hms-iceland-address-register
    - natt-is50v-buildings
    - statistics-iceland-geography
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - island-is-open-data
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
openSourceIds:
