countryCode: JE
name: Jersey
native:
  name: Jersey
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{suburb}}
    {{district}}
    {{postcode}}
    Jersey
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: House number and street name
      required: true
      type: text
    - key: suburb
      label: Locality
      placeholder: ""
      required: false
      type: text
    - key: district
      label: Parish
      placeholder: e.g. Saint Helier
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: JE2 4XX
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{suburb}}
    {{district}}
    {{postcode}}
    Jersey
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: House number and street name
      required: true
      type: text
    - key: suburb
      label: Locality
      placeholder: ""
      required: false
      type: text
    - key: district
      label: Parish
      placeholder: e.g. Saint Helier
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: JE2 4XX
      required: true
      type: text
postalCode:
  format: JE2 4XX
  regex: ^JE\d[A-Z\d]?\s?\d[A-Z]{2}$
  api: https://www.jerseypost.com/tools/address-finder/
  source: Jersey Post address and postcode finder
