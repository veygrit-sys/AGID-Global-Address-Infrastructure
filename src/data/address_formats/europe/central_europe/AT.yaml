countryCode: AT
name: Austria
native:
  name: Österreich
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Firma/Organisation
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Straße
      placeholder: Stephansplatz
      required: true
      type: text
    - key: houseNumber
      label: Hausnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postleitzahl
      placeholder: "1010"
      required: true
      type: text
    - key: city
      label: Stadt
      placeholder: Wien
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    AUSTRIA
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: houseNumber
      label: No.
      placeholder: "1"
    - key: street
      label: Street (Latin)
      placeholder: Stephansplatz
    - key: postcode
      label: Postcode
      placeholder: "1010"
      required: true
    - key: city
      label: City
      placeholder: Vienna
international:
  de:
    name: Deutsch (International)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{postcode}} {{city}}
      ÖSTERREICH
    ordering: small-to-big
    fields:
      - key: organization
        label: Firma/Org. (Latein)
        placeholder: ""
      - key: street
        label: Strasse (Latein)
        placeholder: Stephansplatz
      - key: houseNumber
        label: Nr.
        placeholder: "1"
      - key: postcode
        label: PLZ
        placeholder: "1010"
        required: true
      - key: city
        label: Stadt
        placeholder: Wien
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.post.at/en/g/c/postal-encyclopedia
  source: Österreichische Post postal encyclopedia / BEV Austrian Address Register / Statistik Austria postcode regions
addressRules:
  languages:
    - code: de
      name: German
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - federalState
    - politicalDistrictOrStatutoryCity
    - municipality
    - locality
    - street
    - orientationNumber
    - building
    - staircase
    - doorOrUnit
  postalCode:
    label: 4 digits required; Austrian Post assignment and area geometry are separate, and every area requires source evidence
    required: true
    usage: required
  openSourceIds:
    - austrian-post-postcode
    - austrian-post-address-data
    - bev-austria-address-register
    - statistics-austria-postcode-regions
    - bev-austria-administrative-boundaries
    - statistics-austria-gwr
    - openplzapi
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
