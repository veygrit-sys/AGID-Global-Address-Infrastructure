  - emodnet-bathymetry
  - emodnet-seabed-habitats
  - eea-natura-2000
  - eea-eunis-habitats
  - jrc-esdac-soils
addressRules:
  languages:
    - code: sk
      name: Slovak
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - region
    - district
    - municipality
    - municipalityPart
    - streetOrPublicSpace
    - descriptiveAndOrientationNumber
    - registeredAddressPoint
    - explicitRegisterBuilding
  postalCode:
    label: 5 digits rendered NNN NN; operator assignment, derived PSČ geometry, Register adries identity, building links, and parcels remain separate
    required: true
    usage: required
