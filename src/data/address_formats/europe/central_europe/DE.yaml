countryCode: DE
name: Germany
native:
  name: Deutschland
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Firma/Organisation
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Straße
      placeholder: Hauptstraße
      required: true
      type: text
    - key: houseNumber
      label: Hausnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postleitzahl
      placeholder: "10115"
      required: true
      type: text
    - key: city
      label: Stadt
      placeholder: Berlin
      required: true
      type: text
    - key: state
      label: Bundesland
      placeholder: Berlin
      required: false
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    GERMANY
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: houseNumber
      label: No.
      placeholder: "1"
    - key: street
      label: Street (Latin)
      placeholder: Hauptstrasse
    - key: postcode
      label: Postcode
      placeholder: "10115"
      required: true
    - key: city
      label: City
      placeholder: Berlin
international:
  de:
    name: Deutsch (International)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{postcode}} {{city}}
      DEUTSCHLAND
    ordering: small-to-big
    fields:
      - key: organization
        label: Firma/Org. (Latein)
        placeholder: ""
      - key: street
        label: Strasse (Latein)
        placeholder: Hauptstrasse
      - key: houseNumber
        label: Nr.
        placeholder: "1"
      - key: postcode
        label: PLZ
        placeholder: "10115"
        required: true
      - key: city
        label: Stadt
        placeholder: Berlin
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.postdirekt.de/plzserver/
  source: Deutsche Post Direkt assignment and BKG PLZ geometry with GA/HK-DE address coordinates
addressRules:
  languages:
    - code: de
      name: German
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - state
    - district
    - municipality
    - city
  postalCode:
    label: 5 digits required
    required: true
    usage: required
  openSourceIds:
    - deutsche-post-plz-server
    - deutsche-post-datafactory
    - bkg-postleitzahlgebiete
    - bkg-georeferenced-addresses
    - adv-hk-de
    - adv-hu-de
    - bkg-lod2-de
    - bkg-vg25
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
openSourceIds:
