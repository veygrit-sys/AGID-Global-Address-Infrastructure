countryCode: EA
name: Ceuta and Melilla
native:
  name: Ceuta and Melilla
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    Ceuta o Melilla, España
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full name
      required: true
      type: text
    - key: organization
      label: Organization / Station
      placeholder: Organization, station, or facility
      required: false
      type: text
    - key: street
      label: Street / Local address
      placeholder: Street, road, sector, or locality
      required: false
      type: text
    - key: houseNumber
      label: House / Unit No.
      placeholder: Number
      required: false
      type: text
    - key: postcode
      label: Postal Code
      placeholder: Postal code if used
      required: true
      type: text
    - key: city
      label: City / Locality
      placeholder: City, island, base, or locality
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    CEUTA OR MELILLA, SPAIN
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full name
      required: true
      type: text
    - key: organization
      label: Organization / Station
      placeholder: Organization, station, or facility
      required: false
      type: text
    - key: street
      label: Street / Local address
      placeholder: Street, road, sector, or locality
      required: false
      type: text
    - key: houseNumber
      label: House / Unit No.
      placeholder: Number
      required: false
      type: text
    - key: postcode
      label: Postal Code
      placeholder: Postal code if used
      required: true
      type: text
    - key: city
      label: City / Locality
      placeholder: City, island, base, or locality
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^(?:51|52)\d{3}$
  api: https://www.cartociudad.es/geocoder/api/geocoder/candidates?q={postcode}&limit=10
  source: Grupo Correos / CNIG CartoCiudad (view-only postal surfaces)
addressRules:
  languages:
    - code: es
      name: Spanish
    - code: ar
      name: Arabic
    - code: en
      name: English
  nativeOrder:
    - recipient
    - organization
    - street
    - houseNumber
    - postcode
    - city
    - territory
  englishOrder:
    - recipient
    - organization
    - street
    - houseNumber
    - postcode
    - city
    - territory
  regionalHierarchy:
    - autonomousCity
  postalCode:
    label: NNNNN postal format
    required: true
    usage: required
  openSourceIds:
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
openSourceIds:
