countryCode: NL
name: Netherlands
native:
  name: Nederland
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Naam
      placeholder: Volledige naam
      required: true
      type: text
    - key: organization
      label: Bedrijf/Organisatie
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Straat
      placeholder: Damrak
      required: true
      type: text
    - key: houseNumber
      label: Huisnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: 1012 LG
      required: true
      type: text
    - key: city
      label: Woonplaats
      placeholder: Amsterdam
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Damrak
      required: true
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: 1012 LG
      required: true
      type: text
    - key: city
      label: City
      placeholder: Amsterdam
      required: true
      type: text
postalCode:
  format: NNNN AA
  regex: ^\d{4}\s?[A-Z]{2}$
  api: https://developer.postnl.nl/integration-with-postnl/api-overview/addresses/adrescheck-nederland/documentation-v4/
  source: PostNL Adrescheck Nederland V4 (API key required)
addressRules:
  languages:
    - code: nl
      name: Dutch
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - city
  postalCode:
    label: 4 digits plus 2 letters required
    required: true
    usage: required
  openSourceIds:
    - opendatasoft-nl-postcodes
    - pdok-bag
    - cbs-nl-postcode-areas
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
openSourceIds:
  - opendatasoft-nl-postcodes
