countryCode: BE
name: Belgium
native:
  name: België / Belgique
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Bedrijf / Société
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Straat / Rue
      placeholder: Wetstraat / Rue de la Loi
      required: true
      type: text
    - key: houseNumber
      label: Huisnummer / Numéro
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postcode / Code Postal
      placeholder: "1000"
      required: true
      type: text
    - key: city
      label: Stad / Ville
      placeholder: Brussel / Bruxelles
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    BELGIUM
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: street
      label: Street Address (Latin)
      placeholder: Rue de la Loi
    - key: houseNumber
      label: No.
      placeholder: "1"
    - key: postcode
      label: Postcode
      placeholder: "1000"
      required: true
    - key: city
      label: City
      placeholder: Brussels
