postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.bpost.be/nl/postcodevalidatie-tool
  source: bpost postcode list and postal cantons / BOSA BeSt Address / regional Flanders, Wallonia and Brussels address-building registers / FPS Finance administration and cadastre
addressRules:
  languages:
    - code: nl
      name: Dutch
    - code: fr
      name: French
    - code: de
      name: German
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - region
    - provinceOrBrusselsCapital
    - administrativeArrondissement
    - municipalityNis
    - postalCantonOrSpecialCode
    - localityOrMunicipalityPart
    - streetName
    - houseNumberAndBox
    - bestAddressIdAndRegionalSourceId
    - addressableObjectType
    - explicitRegionalBuildingOrCadastreLink
    - exactRightsClearedBuilding
  postalCode:
    label: 4 digits; no B-/BE- prefix; bpost postal-canton polygon is postal evidence, BeSt supplies address identity, and exact display requires an explicit Flanders, Wallonia, Brussels or cadastre building link
    required: true
    usage: required
  openSourceIds:
