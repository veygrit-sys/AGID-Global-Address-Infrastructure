countryCode: MC
name: Monaco
native:
  name: Monaco
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Société/Organisation
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: Numéro
      placeholder: "1"
      required: true
      type: text
    - key: street
      label: Rue/Avenue
      placeholder: Avenue Princesse Grace
      required: true
      type: text
    - key: postcode
      label: Code Postal
      placeholder: "98000"
      required: true
      type: text
    - key: city
      label: Quartier
      placeholder: Monaco
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    MONACO
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
    - key: houseNumber
      label: House/Building No.
      placeholder: "1"
    - key: street
      label: Street Address
      placeholder: Avenue Princesse Grace
    - key: postcode
      label: Postal Code
      placeholder: "98000"
      required: true
    - key: city
      label: District
      placeholder: Monaco
international:
  fr:
    name: Français (International)
    addressFormat: |-
      {{organization}}
      {{houseNumber}} {{street}}
      {{postcode}} {{city}}
      MONACO
    ordering: small-to-big
    fields:
      - key: organization
        label: Société/Organisation
        placeholder: ""
      - key: houseNumber
        label: Numéro
        placeholder: "1"
      - key: street
        label: Rue/Avenue
        placeholder: Avenue Princesse Grace
      - key: postcode
        label: Code Postal
        placeholder: "98000"
        required: true
      - key: city
        label: Quartier
        placeholder: Monaco
postalCode:
  format: 980NN
  regex: ^980\d{2}$
  api: https://www.data.gouv.fr/datasets/base-officielle-des-codes-postaux
  source: La Poste assignment with DPUM address/building identity and IMSEE district context
addressRules:
  languages:
    - code: fr
      name: French
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - quartier
  postalCode:
    label: 98000 ordinary routing; CEDEX or special 980xx requires allocation evidence
    required: true
    usage: required
