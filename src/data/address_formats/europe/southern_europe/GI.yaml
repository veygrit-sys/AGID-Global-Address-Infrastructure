countryCode: GI
name: Gibraltar
native:
  name: Gibraltar
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{suburb}}
    {{city}}
    {{postcode}}
    Gibraltar
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: House number and street name
      required: true
      type: text
    - key: suburb
      label: Locality
      placeholder: ""
      required: false
      type: text
    - key: city
      label: City
      placeholder: Gibraltar
      required: true
      type: text
    - key: postcode
      label: Postcode
      placeholder: GX11 1AA
      required: true
      type: text
