countryCode: AD
name: Andorra
native:
  name: Andorra
  addressFormat: |-
    {{organization}}
    {{street}}, {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Empresa/Organització
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Carrer
      placeholder: Avinguda Meritxell
      required: true
      type: text
    - key: houseNumber
      label: Número
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Codi Postal
      placeholder: AD500
      required: true
      type: text
    - key: city
      label: Parròquia
      placeholder: Andorra la Vella
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}}, {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Meritxell Ave
      required: true
      type: text
    - key: houseNumber
      label: Number
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: AD500
      required: true
      type: text
    - key: city
      label: Parish
      placeholder: Andorra la Vella
      required: true
      type: text
postalCode:
  format: ADNNN
  regex: ^AD\d{3}$
  api: https://www.correos.es/es/es/empresas/marketing/identifica-a-tus-clientes-potenciales/base-de-datos-de-codigos-postales
  source: Correos official Andorra postcode database / UPU Andorra addressing / Govern d'Andorra Urban Guide / IDE Andorra topography
addressRules:
  languages:
    - code: ca
      name: Catalan
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - parish
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - parish
    - country
  regionalHierarchy:
    - parish
    - populationCentre
    - street
    - addressNumber
    - building
    - entrance
    - unit
  postalCode:
    label: AD plus 3 digits required; parish-coded allocation and geometry require source evidence
    required: true
    usage: required
  openSourceIds:
    - correos-andorra-postcodes
