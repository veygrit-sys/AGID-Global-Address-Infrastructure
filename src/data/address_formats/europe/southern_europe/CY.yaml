countryCode: CY
name: Cyprus
native:
  name: Κύπρος
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Οργανισμός
      required: false
      type: text
    - key: street
      label: Οδός
      required: true
      type: text
    - key: houseNumber
      label: Αριθμός
      required: true
      type: text
    - key: postcode
      label: Ταχυδρομικός Κώδικας
      placeholder: "1010"
      required: true
      type: text
    - key: city
      label: Πόλη
      placeholder: Λευκωσία
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    CY-{{postcode}} {{city}}
    CYPRUS
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
    - key: street
      label: Street
    - key: houseNumber
      label: Number
    - key: postcode
      label: Postal Code
      placeholder: "1010"
      required: true
    - key: city
      label: City
      placeholder: Nicosia
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.cypruspost.post/en/api-postal-codes
  source: Cyprus Post directory and API / DLS INSPIRE Addresses and Buildings / CYSTAT postal sectors
addressRules:
  languages:
    - code: el
      name: Greek
    - code: tr
      name: Turkish
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - district
    - municipalityOrCommunity
    - quarterOrArea
    - locality
    - street
    - houseNumber
    - building
    - unit
  postalCode:
    label: 4 digits required; international display uses CY-, assignment and area geometry are separate, and every area requires source evidence
    required: true
    usage: required
  openSourceIds:
    - cyprus-post-postcode-directory
    - cyprus-post-postcode-api
    - cyprus-dls-inspire-addresses
    - cyprus-dls-inspire-buildings
    - cyprus-dls-administrative-units
    - cystat-postal-sectors
    - eu-cyprus-protocol-10
    - postalcodes-info
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - cyprus-department-lands-surveys
    - cyprus-open-data-portal
    - inspire-cyprus
    - copernicus-dem
