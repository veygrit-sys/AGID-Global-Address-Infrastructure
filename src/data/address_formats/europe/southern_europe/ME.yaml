countryCode: ME
name: Montenegro
native:
  name: Crna Gora
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Preduzeće/Organizacija
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Ulica
      placeholder: Slobode
      required: true
      type: text
    - key: houseNumber
      label: Kućni broj
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Poštanski broj
      placeholder: "81000"
      required: true
      type: text
    - key: city
      label: Grad
      placeholder: Podgorica
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Slobode
      required: true
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "81000"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Podgorica
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.postacg.me/centar-za-korisnike/lokacije-poslovnica/
  source: Pošta Crne Gore post-office assignments and PAK semantics; UZN Address Register and real-estate cadastre; UZN spatial units and Geoportal; MONSTAT Spatial Register
addressRules:
  languages:
    - code: cnr
      name: Montenegrin
  nativeOrder: [name, street, houseNumber, postcode, city, country]
  englishOrder: [name, street, houseNumber, postcode, city, country]
  regionalHierarchy:
    - municipalityOrCapital
    - settlement
    - localCommunity
    - statisticalOrCensusCircle
    - cadastralMunicipality
    - postalOfficeAssignment
    - postalAddressCodePak
    - streetOrSquare
    - houseNumber
    - authoritativeAddressRegisterId
    - cadastralParcelAndBuildingIdentifier
    - explicitRightsClearedBuilding
  postalCode:
    label: 5 digits required; six-digit PAK is separate routing evidence; postal geometry is derived unless operator-proven; an address point or parcel is not a building; exact building output requires an explicit UZN link; property and personal fields remain private
    required: true
    usage: required
  openSourceIds:
    - posta-crne-gore-postcode-office-directory
    - posta-crne-gore-pak-addressing
    - uzn-montenegro-address-register
    - uzn-montenegro-real-estate-cadastre
    - uzn-montenegro-geoportal
    - uzn-montenegro-spatial-unit-record
    - monstat-montenegro-spatial-register
    - eurostat-gisco-postcodes
    - geoportal-montenegro
    - montenegro-cadastre
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
