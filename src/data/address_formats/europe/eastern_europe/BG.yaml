countryCode: BG
name: Bulgaria
native:
  name: България
  addressFormat: |-
    {{postcode}} {{city}}
    {{street}} {{houseNumber}}
    {{organization}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Организация
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Улица
      placeholder: бул. Витоша
      required: true
      type: text
    - key: houseNumber
      label: Номер/Блок/Ап.
      placeholder: 1, бл. 1, ап. 1
      required: true
      type: text
    - key: city
      label: Град
      placeholder: София
      required: true
      type: text
    - key: postcode
      label: Пощенски код
      placeholder: "1000"
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: No./Bldg/Apt
      placeholder: 1, bldg 1, apt 1
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Vitosha Blvd
      required: true
      type: text
    - key: city
      label: City
      placeholder: Sofia
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "1000"
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.bgpost.bg/en/
  source: Bulgarian Posts routing with GRAO address, AGCC cadastral building, and NSI EKATTE evidence
addressRules:
  languages:
    - code: bg
      name: Bulgarian
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - districtOblast
    - municipality
    - settlementEkatte
    - postalAssignmentOrSpecialEndpoint
    - streetBoulevardSquareOrQuarter
    - houseOrBlockNumber
    - entranceFloorApartment
    - authorizedAddressIdentifierAndAccessPoint
    - cadastralBuildingIdentifier
    - explicitRightsClearedBuilding
  postalCode:
    label: 4 digits; Bulgarian Posts routing, EKATTE administration, address identity, cadastral building, and special non-area codes remain separate
    required: true
    usage: required
  openSourceIds:
    - bulgarian-posts-postcode-reference
    - bulgarian-posts-post-office-directory
    - grao-bulgaria-address-classifier
    - agcc-bulgaria-cadastral-map
    - agcc-bulgaria-inspire-buildings
    - nsi-bulgaria-ekatte
    - nsi-bulgaria-administrative-spatial-data
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - cadastre-bulgaria
    - bulgaria-inspire-geoportal
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
