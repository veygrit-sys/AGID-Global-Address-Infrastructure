countryCode: BY
name: Belarus
native:
  name: Беларусь
  addressFormat: |-
    {{postcode}}
    {{state}}
    {{city}}
    {{street}}, {{houseNumber}}
    {{organization}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: Паштовы індэкс
      placeholder: "220000"
      required: true
      type: text
    - key: state
      label: Вобласць
      placeholder: Мінская вобл.
      required: true
      type: text
    - key: city
      label: Горад
      placeholder: Мінск
      required: true
      type: text
    - key: street
      label: Вуліца
      placeholder: пр. Незалежнасці
      required: true
      type: text
    - key: houseNumber
      label: Дом/Кватэра
      placeholder: 1, кв. 1
      required: true
      type: text
    - key: organization
      label: Арганізацыя
      placeholder: ""
      required: false
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}
    {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: House/Apt No.
      placeholder: 1, apt 1
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Independence Ave
      required: true
      type: text
    - key: city
      label: City
      placeholder: Minsk
      required: true
      type: text
    - key: state
      label: Region
      placeholder: Minsk Region
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "220000"
      required: true
      type: text
postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: https://www.belpost.by/
  source: Belpost postcode reference; NCA postal-code zones, Address Register, capital-structure addresses, real-estate and property-characteristics registers; ATE/SOATO administration
addressRules:
  languages:
    - code: be
      name: Belarusian
    - code: ru
      name: Russian
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - oblastOrMinskCity
    - rayonOrCityOfRegionalSubordination
    - villageCouncilOrCityDistrict
    - settlementSoato
    - postalAssignmentOrSpecialEndpoint
    - streetRoadOrInternalAddressElement
    - capitalStructureNumberAndCorpus
    - entranceFloorApartmentOrIsolatedPremise
    - authoritativeAddressIdAndGeocode
    - capitalStructureOrRealEstateIdentifier
    - explicitRightsClearedBuilding
  postalCode:
    label: 6 digits; Belpost assignment and NCA official-derived semiannual zone remain distinct; exact address, isolated premise and capital structure require registry identifiers
    required: true
    usage: required
  russianOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  openSourceIds:
    - osm-nominatim
    - osm-overpass
    - openaddresses
