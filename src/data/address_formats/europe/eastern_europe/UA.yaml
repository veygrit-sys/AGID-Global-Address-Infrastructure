countryCode: UA
name: Ukraine
native:
  name: Україна
  addressFormat: |-
    {{street}}, {{houseNumber}}
    {{city}}
    {{state}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Організація
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Вулиця
      placeholder: Хрещатик
      required: true
      type: text
    - key: houseNumber
      label: Будинок/Квартира
      placeholder: 1, кв. 1
      required: true
      type: text
    - key: city
      label: Місто
      placeholder: Київ
      required: true
      type: text
    - key: state
      label: Область
      placeholder: Київська обл.
      required: true
      type: text
    - key: postcode
      label: Поштовий індекс
      placeholder: "01001"
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}
    {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: House/Apt No.
      placeholder: 1, apt 1
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Khreshchatyk St
      required: true
      type: text
    - key: city
      label: City
      placeholder: Kyiv
      required: true
      type: text
    - key: state
      label: Region
      placeholder: Kyiv Region
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "01001"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://index.ukrposhta.ua/
  source: Ukrposhta open postcode and address directories / UPU Ukraine addressing / Unified State Address Register / Ukraine NSDI
addressRules:
  languages:
    - code: uk
      name: Ukrainian
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - oblastOrSpecialStatusCity
    - raion
    - territorialCommunity
    - settlement
    - street
    - addressNumber
    - buildingOrStructure
    - entrance
    - unit
  postalCode:
    label: 5 digits required; routing assignment and service status are separate, and area requires source evidence
    required: true
    usage: required
  openSourceIds:
    - ukrposhta-postcodes-open-data
    - ukrposhta-index-and-address-api
    - ukraine-unified-address-register
    - ukraine-building-register
    - ukraine-nsdi
    - eurostat-gisco-postcodes
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - data-gov-ua-geodata
    - ukraine-cadastre-map
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
